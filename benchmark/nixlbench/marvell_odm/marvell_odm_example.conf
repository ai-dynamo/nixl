# MARVELL_ODM example configuration (documentation only)
#
# The MARVELL_ODM plugin does not parse a plugin config file. Map these keys
# to nixlbench CLI flags or environment variables as shown below.
#
# Usage:
#   ./nixlbench --backend MARVELL_ODM --device_list odm0 \
#     --initiator_seg_type VRAM --target_seg_type DRAM --op_type WRITE \
#     --odm_use_io_uring --odm_qid_start 0 --odm_qid_end 15 --num_threads 8

# ODM character device (maps to --device_list odm0)
device=odm0

# Queue ID range (maps to --odm_qid_start / --odm_qid_end; nixlbench default 0..15)
odm_qid_start=0
odm_qid_end=15

# Enable io_uring submit path (maps to --odm_use_io_uring; ODM_USE_IO_URING env still accepted)
odm_use_io_uring=1

# Example sweep parameters (maps to nixlbench CLI flags)
total_buffer_size=8589934592
start_block_size=4096
max_block_size=33554432
start_batch_size=64
max_batch_size=64
num_iter=112
warmup_iter=16
