# Single-node nixlbench pod. Edit the three EDIT values, apply, then run
# nixlbench with kubectl exec. See README.md.
apiVersion: v1
kind: Pod
metadata:
  name: nixlbench
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: worker01  # EDIT: node to benchmark
  securityContext:
    seccompProfile:
      type: Unconfined  # io_uring for --posix_api_type URING
  containers:
    - name: nixlbench
      image: nixlbench:latest  # EDIT: image built with contrib/build.sh
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
        limits:
          memory: 64Gi
          nvidia.com/gpu: 1  # nixlbench links libcuda
      volumeMounts:
        - name: storage
          mountPath: /mnt/storage
        - name: dshm
          mountPath: /dev/shm
        - name: udev
          mountPath: /run/udev
          readOnly: true
  volumes:
    - name: storage
      hostPath:
        path: /mnt/nvme0  # EDIT: directory on the device to benchmark
        type: Directory
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi  # UCX shared memory between two processes
    - name: udev
      hostPath:
        path: /run/udev  # cuFile reads block device attributes from udev
