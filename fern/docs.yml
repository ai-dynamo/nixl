          - page: Python Bindings
            path: ../docs/user-guide/building-nixl/python-bindings.md
          - page: Rust Bindings
            path: ../docs/user-guide/building-nixl/rust-bindings.md
      - page: Building a Backend Plugin
        path: ../docs/development/building-a-backend-plugin.md

  # ==================== Examples ====================
  - section: Examples
    contents:
      - page: Basic Two-Peer Transfer
        path: ../docs/examples/basic-transfer.md
      - page: GDS Direct Storage
        path: ../docs/examples/gds-direct-storage.md
      - page: Remote Storage Transfer
        path: ../docs/examples/remote-storage.md
      - page: "NIXL-EP: Expert-Parallel Communication"
        path: ../docs/examples/nixl-ep.md
      - page: etcd Metadata Exchange
        path: ../docs/examples/etcd-metadata-exchange.md
      - page: Telemetry Reader
        path: ../docs/examples/telemetry-reader.md

  # ==================== API Reference ====================
  - section: API Reference
    contents:
      - page: Northbound API Semantics
        path: ../docs/api-reference/northbound-api.md
      - page: C++ API
        slug: cpp-api
        path: ../docs/api-reference/cpp-api.md
      - page: Python API
        path: ../docs/api-reference/python-api.md
      - page: Rust API
        path: ../docs/api-reference/rust-api.md
      - page: Device API
        path: ../docs/api-reference/device-api.md
      - page: "Plugin (Southbound) API"
