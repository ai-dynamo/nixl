instances:
  - url: nvidia-nixl.docs.buildwithfern.com/nixl
    custom-domain: docs.nvidia.com/nixl
    multi-source: true
    # edit-this-page: removed — ai-dynamo/nixl GitHub repo does not contain fern/ directory.
    # Re-add when fern/ is pushed to the public GitHub repo. See .planning/debug/edit-this-page-not-visible.md

title: NIXL Documentation

# Navbar with GitHub link
navbar-links:
  - type: github
    value: https://github.com/ai-dynamo/nixl

# Custom footer component
footer: ./components/CustomFooter.tsx

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

experimental:
  mdx-components:
    - ./components

css:
  - ./main.css
js:
  - url: https://assets.adobedtm.com/5d4962a43b79/c1061d2c5e7b/launch-191c2462b890.min.js
    strategy: beforeInteractive

colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'

typography:
  bodyFont:
    name: NVIDIA
    paths:
      - path: ../docs/assets/fonts/NVIDIASans.woff2
        style: normal
      - path: ../docs/assets/fonts/NVIDIASans_Italic.woff2
        style: italic
  codeFont:
    name: RobotoMono
    paths:
      - path: ../docs/assets/fonts/RobotoMono.woff2

theme:
  page-actions: toolbar
  footer-nav: minimal

page-actions:
  default: ask-ai
  options:
    copy-page: true
    view-as-markdown: true
    ask-ai: true
    claude: true
    chatgpt: true
    cursor: false
    vscode: false

# ai-search: removed — AI search requires Fern Dashboard enablement + Pro plan.
# Basic DocSearch works without this block. Re-add when Dashboard is enabled.
# See .planning/debug/search-bar-no-entry-symbol.md

navigation:
  # ==================== Getting Started ====================
  - section: Getting Started
    contents:
      - page: Overview
        path: ../docs/getting-started/overview.md
      - page: Architecture
        path: ../docs/getting-started/architecture.md
      - page: Quick Start
        path: ../docs/getting-started/quick-start.md
      - page: Contribution Guide
        path: ../docs/getting-started/contributing.md

  # ==================== User Guide ====================
  - section: User Guide
    contents:
      - section: NIXL Backends
        collapsed: open-by-default
        path: ../docs/user-guide/backends/index.md
        contents:
          # Network transports
          - page: UCX
            path: ../docs/user-guide/backends/ucx.md
          - page: Libfabric
            path: ../docs/user-guide/backends/libfabric.md
          - page: Mooncake
            path: ../docs/user-guide/backends/mooncake.md
          - page: UCCL-P2P
            path: ../docs/user-guide/backends/uccl.md
          - page: DOCA GPUNetIO
            path: ../docs/user-guide/backends/gpunetio.md
          # Storage & file backends
          - page: GPUDirect Storage
            path: ../docs/user-guide/backends/gds.md
          - page: GPUDirect Storage MT
            path: ../docs/user-guide/backends/gds-mt.md
          - page: POSIX
            path: ../docs/user-guide/backends/posix.md
          - page: HF3FS
            path: ../docs/user-guide/backends/hf3fs.md
          - page: OBJ
            path: ../docs/user-guide/backends/obj.md
          - page: Azure Blob
            path: ../docs/user-guide/backends/azure-blob.md
          - page: GUSLI
            path: ../docs/user-guide/backends/gusli.md
      - page: "Metadata Exchange with etcd"
        path: ../docs/user-guide/etcd-metadata-exchange.md
      - page: Telemetry Guide
        path: ../docs/user-guide/telemetry.md
      - section: Benchmarking NIXL
        contents:
          - section: NIXLBench
            collapsed: open-by-default
            path: ../docs/user-guide/benchmarking/nixlbench/index.md
            contents:
              - page: Building NIXLBench
                path: ../docs/user-guide/benchmarking/nixlbench/build.md
              - page: Using NIXLBench
                path: ../docs/user-guide/benchmarking/nixlbench/usage.md
          - section: KVBench
            collapsed: open-by-default
            path: ../docs/user-guide/benchmarking/kvbench/index.md
            contents:
              - page: Building KVBench
                path: ../docs/user-guide/benchmarking/kvbench/build.md
              - page: Using KVBench
                path: ../docs/user-guide/benchmarking/kvbench/commands.md

  # ==================== Developer Guide ====================
  - section: Developer Guide
    contents:
      - section: Building NIXL from Source
        collapsed: open-by-default
        path: ../docs/user-guide/building-nixl/index.md
        contents:
          - page: Docker
            path: ../docs/user-guide/building-nixl/docker.md
          - page: "NIXL C++ (Meson)"
