instances:
  - url: nvidia-nixl.docs.buildwithfern.com/nixl
    custom-domain: docs.nvidia.com/nixl
    multi-source: true

title: NIXL Documentation

check:
  rules:
    broken-links: error

navbar-links:
  - type: github
    value: https://github.com/ai-dynamo/nixl

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

css:
  - ./main.css
  - ./css/software-stack-diagram.css
js:
  - url: https://assets.adobedtm.com/5d4962a43b79/c1061d2c5e7b/launch-191c2462b890.min.js
    strategy: beforeInteractive
    disable-sri: true

colors:
  accentPrimary:
    dark: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'

theme:
  page-actions: toolbar
  footer-nav: minimal

page-actions:
  default: ask-ai
  options:
    copy-page: true
    view-as-markdown: true
    ask-ai: true
    claude: true
    chatgpt: true
    cursor: false
    vscode: false


navigation:
  - section: Getting Started
    contents:
      - page: Overview
        path: ./docs/pages/getting-started/overview.md
      - page: Architecture
        path: ./docs/pages/getting-started/architecture.md
      - page: Quick Start
        path: ./docs/pages/getting-started/quick-start.md

  - section: User Guide
    contents:
      - section: NIXL Backends
        collapsed: open-by-default
        path: ./docs/pages/user-guide/backends/index.md
        contents:
          - page: UCX
            path: ./docs/pages/user-guide/backends/ucx.md
          - page: Libfabric
            path: ./docs/pages/user-guide/backends/libfabric.md
          - page: Mooncake
            path: ./docs/pages/user-guide/backends/mooncake.md
          - page: UCCL-P2P
            slug: uccl
            path: ./docs/pages/user-guide/backends/uccl.md
          - page: DOCA GPUNetIO
            slug: gpunetio
            path: ./docs/pages/user-guide/backends/gpunetio.md
          - page: GPUDirect Storage
            slug: gds
            path: ./docs/pages/user-guide/backends/gds.md
          - page: GPUDirect Storage MT
            slug: gds-mt
            path: ./docs/pages/user-guide/backends/gds-mt.md
          - page: POSIX
            path: ./docs/pages/user-guide/backends/posix.md
          - page: HF3FS
            slug: hf3fs
            path: ./docs/pages/user-guide/backends/hf3fs.md
          - page: OBJ
            path: ./docs/pages/user-guide/backends/obj.md
          - page: Azure Blob
            path: ./docs/pages/user-guide/backends/azure-blob.md
          - page: INFINIA
            path: ./docs/pages/user-guide/backends/infinia.md
          - page: GUSLI
            path: ./docs/pages/user-guide/backends/gusli.md
      - page: "Metadata Exchange with etcd"
        path: ./docs/pages/user-guide/etcd-metadata-exchange.md
      - page: Telemetry Guide
        path: ./docs/pages/user-guide/telemetry.md
      - section: Benchmarking NIXL
        contents:
          - section: NIXLBench
            collapsed: open-by-default
            path: ./docs/pages/user-guide/benchmarking/nixlbench/index.md
            contents:
              - page: Building NIXLBench
                path: ./docs/pages/user-guide/benchmarking/nixlbench/build.md
              - page: Using NIXLBench
                path: ./docs/pages/user-guide/benchmarking/nixlbench/usage.md
          - section: KVBench
            collapsed: open-by-default
            path: ./docs/pages/user-guide/benchmarking/kvbench/index.md
            contents:
              - page: Building KVBench
                path: ./docs/pages/user-guide/benchmarking/kvbench/build.md
              - page: Using KVBench
                path: ./docs/pages/user-guide/benchmarking/kvbench/commands.md

  - section: Developer Guide
    contents:
      - section: Building NIXL from Source
        collapsed: open-by-default
        path: ./docs/pages/user-guide/building-nixl/index.md
        contents:
          - page: Docker
            path: ./docs/pages/user-guide/building-nixl/docker.md
          - page: "NIXL C++ (Meson)"
            path: ./docs/pages/user-guide/building-nixl/nixl-cpp.md
          - page: Python Bindings
            path: ./docs/pages/user-guide/building-nixl/python-bindings.md
          - page: Rust Bindings
            path: ./docs/pages/user-guide/building-nixl/rust-bindings.md
      - page: Contribution Guide
        path: ./docs/pages/development/contribution-guide.md

  - section: Resources
    contents:
      - page: Environment Variables
        path: ./docs/pages/resources/environment-variables.md
      - page: Troubleshooting
        path: ./docs/pages/resources/troubleshooting.md

logo:
  dark: ./docs/assets/NVIDIA_dark.svg
  light: ./docs/assets/NVIDIA_light.svg
  height: 20
  href: https://nvidia.com

redirects: []
