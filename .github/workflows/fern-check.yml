name: Fern Documentation Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fern-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate example snippets
        run: python3 fern/scripts/generate_example_snippets.py

      - name: Install D2
        env:
          D2_VERSION: v0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          archive="$RUNNER_TEMP/d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate example diagrams
        run: bash fern/scripts/generate_example_diagrams.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Fern CLI
        run: npm install --global fern-api@5.90.1

      - name: Validate Fern documentation
        working-directory: fern
        run: fern check

      - name: Validate Fern Markdown
        working-directory: fern
        run: fern docs md check
