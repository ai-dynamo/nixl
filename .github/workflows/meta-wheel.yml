name: Meta Wheel Packaging

on: [pull_request]

permissions:
  contents: read

jobs:
  meta-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    - name: Install build tooling
      run: python -m pip install --upgrade meson ninja uv 'setuptools>=80.9.0'
    - name: Run meta-wheel packaging tests
      run: python -m unittest discover -s test/python -p test_meta_wheel.py -v
