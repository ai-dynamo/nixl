# Publish the nixl-sys Rust crate to Artifactory (sw-dynamo-nixl-cargo-local).
#
# This mirrors dynamo's split: GitHub stages the .crate to Artifactory, and the
# release-automation GitLab pipeline consumes it (register-nspect scans the
# Artifactory .crate URL; promote:crates does the final crates.io publish on GA).
# GitLab never pushes to Artifactory — that's this workflow's job.
#
# Runs on GitHub-hosted ubuntu-latest (NOT the self-hosted nixl-builder/velonix
# runners): a --no-verify cargo publish only needs cargo + a token + network, no
# builder image, and velonix's admission hook rejects tag/push events anyway.
#
# Fires on a release/RC tag (v*) or a manual run. Publishes the workspace crate
# (nixl-sys). --no-verify: the source is already built + tested by the wheel/CI
# path, so we package + upload without a full build.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ARTIFACTORY_URL          - e.g. https://artifactory.nvidia.com/artifactory
#   ARTIFACTORY_CARGO_TOKEN  - token with deploy access to the cargo repo
name: Publish nixl-sys crate

on:
  push:
    tags:
      - 'v*'
  # PRs that touch the crate/workflow run this as a DRY RUN (validate; never publish).
  pull_request:
    branches:
      - 'release/**'
      - main
    paths:
      - '.github/workflows/publish-crate.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/bindings/rust/**'
  workflow_dispatch:
    inputs:
      crate_version:
        description: "Version to publish. Default: derived from the tag (v1.4.0 -> 1.4.0); for a manual untagged run, the workspace version + -rc.<run_id>."
        required: false
        default: ""
      dry_run:
        description: "Package only, do not upload (adds cargo publish --dry-run)."
        type: boolean
        required: false
        default: false

jobs:
  publish-crate:
    # Always GitHub-hosted. A --no-verify cargo publish needs no builder image, and
    # the self-hosted velonix runners reject tag/push events at admission anyway.
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_CARGO_TOKEN: ${{ secrets.ARTIFACTORY_CARGO_TOKEN }}
      CARGO_REPO: sw-dynamo-nixl-cargo-local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute crate version
        id: ver
        run: |
          set -e
          IN_VER="${{ github.event.inputs.crate_version }}"
          if [ -n "$IN_VER" ]; then
            VERSION="$IN_VER"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"          # v1.4.0 -> 1.4.0 ; v1.4.0-rc1 -> 1.4.0-rc1
          else
            BASE="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
            VERSION="${BASE}-rc.${GITHUB_RUN_ID}"    # manual untagged run -> pre-release
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing nixl-sys version: $VERSION"

      - name: Guard secrets
        # Only the real-publish path needs the token; the PR package check does not.
        if: github.event_name != 'pull_request'
        run: |
          echo "ARTIFACTORY_CARGO_TOKEN length: ${#ARTIFACTORY_CARGO_TOKEN}"
          [ -n "$ARTIFACTORY_CARGO_TOKEN" ] || { echo "ERROR: ARTIFACTORY_CARGO_TOKEN secret is empty/unavailable for this ref."; exit 1; }
          [ -n "$ARTIFACTORY_URL" ] || { echo "ERROR: ARTIFACTORY_URL secret is empty."; exit 1; }

      - name: Set workspace version
        run: |
          set -e
          # Bump the [workspace.package] version (nixl-sys uses version.workspace = true).
          sed -i -E "s/^(version = \")([^\"]+)(\")/\1${{ steps.ver.outputs.version }}\3/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Package (PR) or publish (tag/manual)
        run: |
          set -e
          # ubuntu-latest ships cargo; fall back to rustup just in case.
          if ! command -v cargo >/dev/null 2>&1; then
            echo "cargo not found; installing via rustup"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation only: assemble the .crate locally — no upload, no registry, no token.
            echo "PR validation: cargo package (no upload)"
            cargo package --manifest-path src/bindings/rust/Cargo.toml --no-verify --allow-dirty
          else
            # Real publish on a v* tag; a manual run can force a dry run via the input.
            DRY=""
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
            [ -n "$DRY" ] && echo "DRY RUN: packaging only, no upload"
            # Token passed via env inside the arg; do not enable `set -x` around this line.
            cargo publish --manifest-path src/bindings/rust/Cargo.toml \
              --token "Bearer ${ARTIFACTORY_CARGO_TOKEN}" \
              --index "sparse+${ARTIFACTORY_URL}/api/cargo/${CARGO_REPO}/index/" \
              --no-verify --allow-dirty $DRY
          fi

# The downstream GitLab compliance pipeline (wheel scan + SonarQube + nSpect) is
# triggered by the separate .github/workflows/nixl-compliance.yml, which calls the
# shared release-automation reusable workflow (PROJECT=nixl). It finds the wheels in
# Artifactory by name+version, so no blossom build-id is needed here.
