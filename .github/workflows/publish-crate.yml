# Publish the nixl-sys Rust crate to Artifactory.
#
# Crate publishing lives here (GitHub), not in the nixl-ci GitLab pipeline: the
# source is native to the checkout (no mirror clone / build-id pinning), and the
# Artifactory cargo token is already scoped to this repo's Actions secrets. Wheels
# are built on blossom; nSpect register + scan happen GitLab-side; this owns crates.
#
# Fires on a release/RC tag (v*), or run manually. Publishes the workspace crate
# (nixl-sys) to sw-dynamo-nixl-cargo-local. --no-verify: the source is already
# built + tested by the wheel/CI path, so we package + upload without a full build.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ARTIFACTORY_URL          - e.g. https://artifactory.nvidia.com/artifactory
#   ARTIFACTORY_CARGO_TOKEN  - token with deploy access to the cargo repo
name: Publish nixl-sys crate

on:
  push:
    tags:
      - 'v*'
  # PRs that touch the crate/workflow run this as a DRY RUN (validate; never publish).
  pull_request:
    branches:
      - 'release/**'
      - main
    paths:
      - '.github/workflows/publish-crate.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/bindings/rust/**'
  workflow_dispatch:
    inputs:
      crate_version:
        description: "Version to publish. Default: derived from the tag (v1.4.0 -> 1.4.0); for a manual untagged run, the workspace version + -rc.<run_id>."
        required: false
        default: ""
      dry_run:
        description: "Package only, do not upload (adds cargo publish --dry-run)."
        type: boolean
        required: false
        default: false
      wheel_build_id:
        description: "Blossom wheel build-id (short SHA, e.g. 51a42f86) under sw-nbu-swx-nixl-pypi-local/release/<ver>/. Needed to trigger the GitLab wheel scan after publish."
        required: false
        default: ""

jobs:
  publish-crate:
    # PRs validate on a GitHub-hosted runner (the nixl-builder velonix runners reject
    # pull_request events at admission); tag/manual runs publish on the nixl-builder runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || format('{0}-nixl-builder-amd-v1', vars.NIXL_RUNNER_PREFIX || 'prod') }}
    env:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_CARGO_TOKEN: ${{ secrets.ARTIFACTORY_CARGO_TOKEN }}
      CARGO_REPO: sw-dynamo-nixl-cargo-local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute crate version
        id: ver
        run: |
          set -e
          IN_VER="${{ github.event.inputs.crate_version }}"
          if [ -n "$IN_VER" ]; then
            VERSION="$IN_VER"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"          # v1.4.0 -> 1.4.0 ; v1.4.0-rc1 -> 1.4.0-rc1
          else
            BASE="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
            VERSION="${BASE}-rc.${GITHUB_RUN_ID}"    # manual untagged run -> pre-release
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing nixl-sys version: $VERSION"

      - name: Guard secrets
        # Only the real-publish path needs the token; the PR package check does not.
        if: github.event_name != 'pull_request'
        run: |
          echo "ARTIFACTORY_CARGO_TOKEN length: ${#ARTIFACTORY_CARGO_TOKEN}"
          [ -n "$ARTIFACTORY_CARGO_TOKEN" ] || { echo "ERROR: ARTIFACTORY_CARGO_TOKEN secret is empty/unavailable for this ref."; exit 1; }
          [ -n "$ARTIFACTORY_URL" ] || { echo "ERROR: ARTIFACTORY_URL secret is empty."; exit 1; }

      - name: Set workspace version
        run: |
          set -e
          # Bump the [workspace.package] version (nixl-sys uses version.workspace = true).
          sed -i -E "s/^(version = \")([^\"]+)(\")/\1${{ steps.ver.outputs.version }}\3/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Package (PR) or publish (tag/manual)
        run: |
          set -e
          # The nixl-builder runner ships cargo; ubuntu-latest does too. Fall back to rustup.
          if ! command -v cargo >/dev/null 2>&1; then
            echo "cargo not found; installing via rustup"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation only: assemble the .crate locally — no upload, no registry, no token.
            echo "PR validation: cargo package (no upload)"
            cargo package --manifest-path src/bindings/rust/Cargo.toml --no-verify --allow-dirty
          else
            # Real publish on a v* tag; a manual run can force a dry run via the input.
            DRY=""
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
            [ -n "$DRY" ] && echo "DRY RUN: packaging only, no upload"
            # Token passed via env inside the arg; do not enable `set -x` around this line.
            cargo publish --manifest-path src/bindings/rust/Cargo.toml \
              --token "Bearer ${ARTIFACTORY_CARGO_TOKEN}" \
              --index "sparse+${ARTIFACTORY_URL}/api/cargo/${CARGO_REPO}/index/" \
              --no-verify --allow-dirty $DRY
          fi

  # After a REAL crate publish (tag, or manual non-dry), trigger the nixl-ci GitLab
  # pipeline to run the wheel nSpect register + scan (PIPELINE_TYPE=rc). The wheels
  # live on blossom at sw-nbu-swx-nixl-pypi-local/release/<WHEEL_VERSION>/<WHEEL_BUILD_ID>/,
  # so the blossom build-id must be supplied (workflow_dispatch input wheel_build_id, or
  # repo var WHEEL_BUILD_ID); without it the wheel scan can't locate the wheels and the
  # trigger is skipped. MUST run on an NVIDIA-internal runner group — the AWS builders
  # can't reach gitlab-master.nvidia.com.
  # Required secrets (release environment): GITLAB_NIXL_PIPELINE_URL, GITLAB_NIXL_TRIGGER_TOKEN.
  # NOTE: until the nspect/scan rewire lands on nixl-ci main, set repo var NIXL_CI_REF to
  # the feature branch (nmailhot/rc-nbuswx-nspect-crates) so the trigger runs the new jobs.
  trigger-scan:
    needs: publish-crate
    if: ${{ github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true' }}
    runs-on:
      group: gitlab_ci_runners
    environment: release
    env:
      GITLAB_TRIGGER_URL: ${{ secrets.GITLAB_NIXL_PIPELINE_URL }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_NIXL_TRIGGER_TOKEN }}
      NSPECT_ID: NSPECT-WO64-8O3P
      NIXL_CI_REF: ${{ vars.NIXL_CI_REF || 'main' }}
      WHEEL_BUILD_ID: ${{ github.event.inputs.wheel_build_id || vars.WHEEL_BUILD_ID || '' }}
    steps:
      - name: Trigger nixl-ci wheel scan + nSpect
        run: |
          set -euo pipefail
          # Base version + rc from the tag (v1.4.0-rc1 -> 1.4.0 / 1), else the manual input.
          REF="${GITHUB_REF_NAME}"
          if [ "${{ github.ref_type }}" = "tag" ]; then VER="${REF#v}"; else VER="${{ github.event.inputs.crate_version }}"; fi
          BASE_VERSION="${VER%%-rc*}"
          RC_NUMBER="${VER##*-rc}"; [ "$RC_NUMBER" = "$VER" ] && RC_NUMBER=""
          if [ -z "${WHEEL_BUILD_ID}" ]; then
            echo "::warning::No wheel_build_id — GitLab wheel scan can't locate the blossom wheels; skipping trigger. Re-run via 'Run workflow' with wheel_build_id set (or set repo var WHEEL_BUILD_ID)."
            exit 0
          fi
          # Trigger token via @file so it never lands in process listings / set -x.
          TOKEN_FILE=$(mktemp); trap 'rm -f "${TOKEN_FILE}"' EXIT; chmod 600 "${TOKEN_FILE}"
          printf '%s' "${GITLAB_TRIGGER_TOKEN}" > "${TOKEN_FILE}"
          RESPONSE=$(curl -fsSL --request POST \
            --form "token=<${TOKEN_FILE}" \
            --form "ref=${NIXL_CI_REF}" \
            --form "variables[PIPELINE_TYPE]=rc" \
            --form "variables[NSPECT_ID]=${NSPECT_ID}" \
            --form "variables[WHEEL_VERSION]=${BASE_VERSION}" \
            --form "variables[WHEEL_BUILD_ID]=${WHEEL_BUILD_ID}" \
            --form "variables[RC_TAG]=${REF}" \
            --form "variables[RC_NUMBER]=${RC_NUMBER}" \
            --form "variables[COMMIT_SHA]=${GITHUB_SHA}" \
            --form "variables[ENABLE_WHEEL_SCAN]=true" \
            "${GITLAB_TRIGGER_URL}")
          PIPELINE_ID=$(echo "${RESPONSE}" | jq -r '.id // empty')
          PIPELINE_URL=$(echo "${RESPONSE}" | jq -r '.web_url // empty')
          if [ -z "${PIPELINE_ID}" ]; then
            echo "::error::Failed to trigger nixl-ci pipeline"; echo "Response: ${RESPONSE}"; exit 1
          fi
          echo "Triggered nixl-ci scan pipeline ${PIPELINE_ID}: ${PIPELINE_URL}"
          {
            echo "## nixl-ci wheel scan + nSpect"
            echo "| Pipeline | ${PIPELINE_URL:-$PIPELINE_ID} |"
            echo "|--|--|"
            echo "| Version | ${BASE_VERSION}${RC_NUMBER:+ (rc$RC_NUMBER)} |"
            echo "| Wheel build-id | ${WHEEL_BUILD_ID} |"
          } >> "${GITHUB_STEP_SUMMARY}"
