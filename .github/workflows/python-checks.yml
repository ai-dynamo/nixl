name: Python Checks

on: [pull_request]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        path:
          - ./src
          - ./test
          - ./benchmark
          - ./examples/python
    steps:
    - uses: actions/checkout@v3
    - name: Check for print() calls in ${{ matrix.path }}
      run: |
        ./.ci/scripts/check_prints.sh ${{ matrix.path }}

  contrib-tests:
    # Unit tests of the build/CI tooling under contrib/: pure Python, no NIXL build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run contrib tests
      run: |
        python -m pip install pytest
        python -m pytest contrib/tests -q
