---
#
# CMX Test Matrix Configuration
#
# Builds NIXL with DOCA KV and runs nixlbench against the DOCA_MEMOS backend
# as a smoke test, on a mizu node with a BlueField. The base and build_helper
# images are shared with nixl-ci-gpu (identical build args), so only the
# per-build PR image and Slurm container names are namespaced with -cmx.
#
# Key Components:
# - Job Configuration: Defines timeout, failure behavior, and server resources
# - Docker Images: Specifies the container images used for different build stages
# - Matrix Axes: Defines build variations (currently x86_64 architecture)
# - Run Steps: Sequential steps for running tests
#
# When Modified:
# - Adding/removing Docker images: Affects available test environments
# - Modifying matrix axes: Changes test variations (e.g., adding architectures)
# - Adjusting resource limits: Impacts test performance and resource allocation
# - Adding/removing steps: Changes the test pipeline sequence
#
# Note: Changes to this file are tested as part of the PR CI flow no need to test them manually.


job: nixl-ci-cmx

# Fail job if one of the steps fails or continue
failFast: false

timeout_minutes: 240

registry_host: il.artifactory.nvidia.com
registry_auth: svc-nixl-il-artifactory-token
registry_path: /sw-nbu-swx-nixl-docker-local/ci

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  limits: "{memory: 16Gi, cpu: 16000m}"
  requests: "{memory: 8Gi, cpu: 8000m}"
  privileged: true

credentials:
  - credentialsId: 'svc-nixl-github-read-only-token'
    usernameVariable: 'NIXL_GITHUB_USER'
    passwordVariable: 'NIXL_GITHUB_TOKEN'
  - {credentialsId: 'svc-nixl-il-artifactory-token', usernameVariable: 'REPO_USER', passwordVariable: 'REPO_PASS'}
  - {credentialsId: 'svc-nixl-ssh_key', type: 'sshUserPrivateKey', keyFileVariable: 'SSH_KEY'}
  - {credentialsId: 'svc-nixl-gitlab-token', usernameVariable: 'GIT_USER', passwordVariable: 'GIT_PASS'}

env:
  ARTIFACTORY_PATH: /sw-nbu-swx-nixl-docker-local/ci
  NIXL_INSTALL_DIR: /opt/nixl
  NIXL_BUILD_DIR: nixl_build
  SLURM_NODES: 1
  SLURM_PARTITION: mizu
  SLURM_HEAD_NODE: scctl
  SLURM_GRES: "gpu:1,bf:1"
  SLURM_MEM: 128G
  SLURM_MINCPUS: 16
  SLURM_JOB_TIMEOUT: '01:30:00'
  SLURM_IMMEDIATE_TIMEOUT: "3600"
  SCCTL_CREDENTIALS_ID: 'svc-nixl-scctl'
  JOB_ID_FILE_ROOT: "/mnt/pvc/${JOB_BASE_NAME}"
  STORAGE_DRIVER: overlay
  # Auto-derived and patched by cidemo-init.sh at CI time from the CI source files;
  # the "CI_MANAGED" placeholder must not be hand-edited.
  CI_IMAGE_TAG: "CI_MANAGED"
  ENROOT_MOUNT_PATH: "/enroot_images"  # NFS mount on mizu nodes; on failure the container is exported here as <containerName>.sqsh
  ENROOT_DATA_PATH: "/enroot-data/enroot-data-148069/user-148069"  # svc-nixl user on mizu nodes

empty_volumes:
  - {mountPath: /root, memory: false}
  - {mountPath: /var/lib/containers/storage, memory: false}

pvc_volumes:
  - {claimName: nbu-swx-nixl-pvc, mountPath: /mnt/pvc, readOnly: false}

# ci-demo builds the images below outside any step; an entry's credentialsId binds
# the token around its build, and this hook writes the git config the Dockerfile
# mounts as the "ghconfig" secret. Left empty when nothing is bound.
pipeline_on_image_build:
  run: |
    #!/bin/bash -e
    . .ci/scripts/common.sh
    write_github_gitconfig /tmp/ghconfig

# label is defined at jenkins slave configuration, we want to run the job on a gpu agent and be able to esaly replace it without having to change this file
runs_on_dockers:
  - {
     file: '.ci/dockerfiles/Dockerfile.base',
     name: 'nixl-ci-gpu-base',
     tag: "${CI_IMAGE_TAG}",
     build_args: '--build-arg NIXL_INSTALL_DIR=${NIXL_INSTALL_DIR}  --build-arg PRE_INSTALLED_UCX_ENV=true --build-arg PRE_INSTALLED_NIXL_ENV=true --build-arg ARCH=${arch} --pull --no-cache --secret id=ghconfig,src=/tmp/ghconfig',
     credentialsId: 'svc-nixl-github-read-only-token'
    }
  - {
     file: '.ci/dockerfiles/Dockerfile.build_helper',
     name: 'build_helper',
     tag: "${CI_IMAGE_TAG}"
    }

matrix:
  axes:
    arch:
      - x86_64

taskName: "${name}/${arch}/${axis_index}"


steps:
  - name: Compiling NIXL Docker Image
    containerSelector: "{name: 'build_helper'}"
    credentialsId:
      - 'svc-nixl-il-artifactory-token'
      - 'svc-nixl-github-read-only-token'
      - 'svc-nixl-ssh_key'
      - 'svc-nixl-gitlab-token'
    parallel: false
    run: |
      set -x
      # github.com credential for build.sh's clones, incl. meson's [wrap-git] subprojects ("ghconfig" build secret).
      (. .ci/scripts/common.sh && write_github_gitconfig /tmp/ghconfig)
      export PR_IMAGE=${registry_host}${registry_path}/pr/${arch}/nixl-ci-cmx-test:${BUILD_NUMBER}
      rm -rf /etc/containers/storage.conf && rm -f /usr/share/containers/storage.conf
      set +x -v
      echo "$REPO_PASS" | podman login "https://${registry_host}" -u "$REPO_USER" --password-stdin
      set +v -x
      podman build --network host \
      --build-arg PRE_INSTALLED_ENV="true" \
      --build-arg NIXL_INSTALL_DIR=${NIXL_INSTALL_DIR} \
      --build-arg NIXL_BUILD_DIR=${NIXL_BUILD_DIR} \
      --build-arg DOCA_KV_ENV=true \
      --build-arg HAS_GPU=true \
      --build-arg BASE_IMAGE=${registry_host}${registry_path}/${arch}/nixl-ci-gpu-base:${CI_IMAGE_TAG} \
      --secret id=ghconfig,src=/tmp/ghconfig \
      --tag ${PR_IMAGE} \
      --secret id=ssh_key,src=${SSH_KEY} \
      --secret id=git_user,env=GIT_USER \
      --secret id=git_pass,env=GIT_PASS \
      -f .ci/dockerfiles/Dockerfile.gpu-test .
      for i in {1..6}; do
          podman push ${PR_IMAGE} && break
          [ "$i" = 6 ] && exit 1
          sleep $((2 ** (i - 1)))
      done

  - name: Allocate Environment
    containerSelector: "{name: 'build_helper'}"
    parallel: false
    shell: action
    module: slurmCI
    run: allocation
    args:
      partition: "${SLURM_PARTITION}"
      headNode: "${SLURM_HEAD_NODE}"
      nodes: "${SLURM_NODES}"
      jobTimeout: "${SLURM_JOB_TIMEOUT}"
      immediateTimeout: "${SLURM_IMMEDIATE_TIMEOUT}"
      jobName: "${JOB_BASE_NAME}-${BUILD_NUMBER}"
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${BUILD_NUMBER}.txt"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      extraArgs: [
        "--gres=${SLURM_GRES}",
        "--mincpus=${SLURM_MINCPUS}",
        "--mem=${SLURM_MEM}"
      ]

  - name: Sync Container Image
    # Import the image onto the node before the timed test stages, so a slow
    # registry pull is not counted against (and does not time out) a test stage.
    containerSelector: "{name: 'build_helper'}"
    timeout: 30
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${BUILD_NUMBER}.txt"
      testScript: "hostname; nvidia-smi -L || echo no-gpu-visible; df -h /"
      headNode: "${SLURM_HEAD_NODE}"
      dockerImage: "${registry_host}#${ARTIFACTORY_PATH}/pr/${arch}/nixl-ci-cmx-test:${BUILD_NUMBER}"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      containerName: "nixl-ci-cmx-${BUILD_NUMBER}"
      exportEnroot: "true"  # on failure, export the container to ${ENROOT_MOUNT_PATH} for crash debugging

  - name: Run CMX tests
    containerSelector: "{name: 'build_helper'}"
    timeout: 50
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${BUILD_NUMBER}.txt"
      testScript: ".gitlab/test_cmx.sh ${NIXL_INSTALL_DIR}"
      headNode: "${SLURM_HEAD_NODE}"
      dockerImage: "${registry_host}#${ARTIFACTORY_PATH}/pr/${arch}/nixl-ci-cmx-test:${BUILD_NUMBER}"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      containerName: "nixl-ci-cmx-${BUILD_NUMBER}"
      exportEnroot: "true"  # on failure, export the container to ${ENROOT_MOUNT_PATH} for crash debugging

pipeline_stop:
  containerSelector: "{name: 'build_helper'}"
  parallel: false
  shell: action
  module: slurmCI
  run: stopAllForBuild
  args:
    credentialsId: "${SCCTL_CREDENTIALS_ID}"
    headNode: "${SLURM_HEAD_NODE}"
    jobIdDir: "${JOB_ID_FILE_ROOT}"
