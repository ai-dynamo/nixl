# Release wheel poller. Runs every 4 hours on main; compares release-branch
# commits against the wheels already published in Artifactory
# (sw-nbu-swx-nixl-pypi-local) and triggers nixl-ci-build-wheel-nightly once per
# release-branch commit whose wheels are still missing.
#
# How it works:
# - One trigger per commit, not per CUDA variant: the wheel job builds every
#   CUDA major in a single run. The scan is .ci/scripts/scan-missing-release-wheels.sh.
# - Which releases build: every release/* branch with version >= MIN_RELEASE
#   whose build-container.sh accepts --build-options-file (the nightly always
#   passes it) - picked up automatically, new release branches need no change.
# - Which UCX and plugins: whatever the release's own build-container.sh pins;
#   the poller passes neither, so each release ships what it was built to ship.
# - Which commits: newest MAX_COMMITS first-parent commits past the fork from main.
# - Published check: a build folder under release/<ver>/ carrying the commit as
#   a NIXL_SHA property. The wheel job stamps it only on SUCCESS, so a partial
#   upload never reads as published - it deletes its own folder on failure.
# - In flight: a release/<ver>/.inflight/<sha8> reservation written here before
#   triggering. The marker only appears when a build ends, so without this a
#   build still running at the next poll would be triggered again.
# - Consequences: a failing build retries every cycle until it succeeds or the
#   commit falls out of the MAX_COMMITS window. To force a rebuild, delete the
#   commit's folder in Artifactory (or just its NIXL_SHA property).

---
job: nixl-build-wheel-release-poller

timeout_minutes: 30

registry_host: artifactory.nvidia.com

credentials:
  - credentialsId: 'svc-nixl-new-artifactory-token'
    usernameVariable: 'ARTIFACTORY_USER'
    passwordVariable: 'ARTIFACTORY_TOKEN'

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  imagePullSecrets: "['artifactory-pull-secret']"
  limits: '{memory: 2Gi, cpu: 2000m}'
  requests: '{memory: 2Gi, cpu: 2000m}'

runs_on_dockers:
  - { name: "poller", url: "quay.io/podman/stable:v5.7.1", arch: "x86_64" }

env:
  # Releases older than this are not built. Anything newer is picked up automatically.
  MIN_RELEASE: "1.4.0"
  # Newest N commits to check per release branch.
  MAX_COMMITS: "10"
  NIXL_REPO_URL: "https://github.com/ai-dynamo/nixl.git"
  # The published check is a property query, so AQL needs the repo by name; the
  # URL is for writing .inflight reservations.
  AQL_API_URL: "https://artifactory.nvidia.com/artifactory/api/search/aql"
  WHEEL_REPO_NAME: "sw-nbu-swx-nixl-pypi-local"
  WHEEL_REPO_URL: "https://artifactory.nvidia.com/artifactory/sw-nbu-swx-nixl-pypi-local"
  WHEEL_REPO_API: "https://artifactory.nvidia.com/artifactory/api/storage/sw-nbu-swx-nixl-pypi-local"
  # One poll interval, so a build that died without publishing is retried on the
  # next cycle rather than needing the wheel job to release its reservation.
  RESERVE_TTL_MIN: "240"
  MAIL_FROM: "jenkins@nvidia.com"

steps:
  - name: Discover Missing Wheels
    credentialsId: 'svc-nixl-new-artifactory-token'
    parallel: false
    run: |
      # Writes triggers.txt for the next step.
      .ci/scripts/scan-missing-release-wheels.sh

  - name: Trigger Release Builds
    shell: action
    module: groovy
    parallel: false
    run: |
      def triggers = fileExists('triggers.txt') ? readFile('triggers.txt').trim() : ''
      if (triggers) {
          // Forward our CI ref so a pre-merge test poller run drives builds
          // with the same pipeline + config revision.
          def ciRefspec = params.ci_refspec ?: 'main'
          def spawned = []
          def failed = []
          for (line in triggers.split('\n')) {
              // line: <nixl_sha> <ver>
              def parts = line.trim().split(/\s+/)
              // Per-line guard: one bad trigger must not drop the remaining
              // lines; the next poll retries anything missed.
              try {
                  build(job: 'nixl-ci-build-wheel-nightly',
                        parameters: [
                            string(name: 'NIXL_VERSION', value: parts[0]),
                            string(name: 'PUBLISH_DIR', value: "release/${parts[1]}"),
                            string(name: 'ci_refspec', value: ciRefspec),
                        ],
                        wait: false,
                        propagate: false)
                  // The publish folder is the spawned build's own number, which
                  // build(wait:false) does not return - identify it by sha here.
                  spawned << "release/${parts[1]} @ ${parts[0].take(8)}  (NIXL_VERSION=${parts[0]})"
              } catch (err) {
                  failed << "${line}: ${err}"
                  currentBuild.result = 'UNSTABLE'
              }
          }
          // Outcome report. build(wait:false) yields no per-run URL, so link the
          // nightly job; each spawned build back-links here as "upstream
          // #${BUILD_NUMBER}", and its per-build downstream link is on this
          // build's page in the classic UI (Blue Ocean hides the widget).
          def report = ["", "===== poller spawned ${spawned.size()} build(s) -> ${env.JENKINS_URL}job/nixl-ci-build-wheel-nightly/ ====="]
          report += spawned.collect { "  + ${it}" }
          if (failed) {
              report << "----- ${failed.size()} failed to trigger (retried next cycle) -----"
              report += failed.collect { "  ! ${it}" }
          }
          echo report.join('\n')
      } else {
          echo 'No missing wheels - nothing to trigger.'
      }

taskName: '${name}'

# Mail the unattended poller only when it fails, mirroring the nightly.
pipeline_stop:
  shell: action
  module: groovy
  containerSelector: "{name: 'poller'}"
  run: |
    def jobStatus = currentBuild.result ?: 'SUCCESS'
    if (jobStatus != 'SUCCESS' && params.MAIL_TO) {
        def userName = currentBuild.rawBuild.getCause(hudson.model.Cause.UserIdCause)?.userName ?: 'schedule'
        mail(
            from: env.MAIL_FROM,
            to: params.MAIL_TO,
            subject: "Job '${env.JOB_NAME} [${env.BUILD_NUMBER}]' - ${jobStatus}",
            mimeType: 'text/html',
            body: """
                <p>Started by: <b>${userName}</b></p>
                <p>Status: <span style="color: red;"><b>${jobStatus}</b></span></p>
                <p>Job: <a href='${env.JOB_URL}'>${env.JOB_NAME}</a></p>
                <p>Build: <a href='${env.BUILD_URL}'>#${env.BUILD_NUMBER}</a></p>
                <p>Console Output: <a href='${env.BUILD_URL}console'>Full Log</a></p>
            """
        )
    }
