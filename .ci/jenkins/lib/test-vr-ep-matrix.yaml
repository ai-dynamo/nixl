---
#
# Vera Rubin GPU EP Test Matrix Configuration for dlcluster.nvidia.com
#
# Runs nixl_ep native elastic.py tests on the Vera Rubin
# (vrnvl72 / account rubin) partition. This job is split out from
# nixl-ci-gpu-vr so the EP-specific image build (BUILD_NIXL_EP=true) and the
# 4-GPU EP Slurm reservation do not affect the existing VR test flow. It is the
# Vera Rubin twin of nixl-ci-dl-gpu-ep and shares its EP base and build_helper
# images (identical build args, so they reuse the same CI_IMAGE_TAG cache).
# The vLLM+nixl_ep test is skipped here for now (see the TODO at the test step).
#
# Key Components:
# - Job Configuration: Defines timeout, failure behavior, and server resources
# - Docker Images: Shared EP base + build_helper (nixl-ci-dl-gpu-ep-base and
#                  build_helper_dl_ep)
# - Matrix Axes: aarch64 (UCX version from the UCX_VER job parameter)
# - Run Steps: build PR image with BUILD_NIXL_EP=true, allocate Slurm, run
#              .gitlab/test_ep.sh (nixl_ep native elastic.py tests on 4 GPUs)
#
# When Modified:
# - Adding/removing Docker images: Affects available test environments
# - Modifying matrix axes: Changes test variations
# - Adjusting resource limits: Impacts test performance and resource allocation
# - Adding/removing steps: Changes the test pipeline sequence
#
# Note: Changes to this file are tested as part of the PR CI flow no need to test them manually.


job: nixl-ci-gpu-vr-ep

# Fail job if one of the steps fails or continue
failFast: false

timeout_minutes: 480

registry_host: il.artifactory.nvidia.com
registry_auth: svc-nixl-il-artifactory-token
registry_path: /sw-nbu-swx-nixl-docker-local/ci

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  limits: "{memory: 16Gi, cpu: 16000m}"
  requests: "{memory: 8Gi, cpu: 8000m}"
  privileged: true

credentials:
  - credentialsId: 'svc-nixl-github-read-only-token'
    usernameVariable: 'NIXL_GITHUB_USER'
    passwordVariable: 'NIXL_GITHUB_TOKEN'
  - {credentialsId: 'svc-nixl-il-artifactory-token', usernameVariable: 'REPO_USER', passwordVariable: 'REPO_PASS'}

env:
  ARTIFACTORY_PATH: /sw-nbu-swx-nixl-docker-local/ci
  NIXL_INSTALL_DIR: /opt/nixl
  NIXL_EP_PYTHON: /home/svc-nixl/vllm/.venv/bin/python
  NIXL_BUILD_DIR: nixl_build
  SLURM_NODES: 1
  SLURM_PARTITION: vrnvl72
  SLURM_HEAD_NODE: dlcluster.nvidia.com
  SLURM_HEAD_USER: svc-nixl
  SLURM_ACCOUNT: 'rubin'
  # The nixl_ep tests use four local ranks.
  SLURM_GRES: gpu:4
  SLURM_MEM: 256G
  SLURM_MINCPUS: 48
  # Nodes whose configuration differs from the rest of the partition
  SLURM_EXCLUDE: 'vr-nvl72-ts3-l06-comp137,vr-nvl72-ts3-l06-comp139,vr-nvl72-ts3-l06-comp141,vr-nvl72-ts2b-l10-comp102'
  SLURM_JOB_TIMEOUT: '02:30:00'
  SLURM_IMMEDIATE_TIMEOUT: 14400
  SSH_CREDENTIALS_ID: 'svc-nixl-ssh_key'
  JOB_ID_FILE_ROOT: "/mnt/pvc/${JOB_BASE_NAME}"
  TEST_TIMEOUT: 90
  VLLM_HF_ENDPOINT: "https://artifactory.nvidia.com/artifactory/api/huggingfaceml/huggingface-remote"
  STORAGE_DRIVER: overlay
  # Auto-derived and patched by cidemo-init.sh at CI time from the CI source files;
  # the "CI_MANAGED" placeholder must not be hand-edited.
  CI_IMAGE_TAG: "CI_MANAGED"

empty_volumes:
  - {mountPath: /var/lib/containers/storage, memory: false}

pvc_volumes:
  - {claimName: nbu-swx-nixl-pvc, mountPath: /mnt/pvc, readOnly: false}

# ci-demo builds the images below outside any step; an entry's credentialsId binds
# the token around its build, and this hook writes the git config the Dockerfile
# mounts as the "ghconfig" secret. Left empty when nothing is bound.
pipeline_on_image_build:
  run: |
    #!/bin/bash -e
    . .ci/scripts/common.sh
    write_github_gitconfig /tmp/ghconfig

# Docker images for EP testing.
# Shared with nixl-ci-dl-gpu-ep: identical names and build args, so both jobs
# reuse the same CI_IMAGE_TAG-keyed base and build_helper images.
runs_on_dockers:
  - {
     file: '.ci/dockerfiles/Dockerfile.base',
     name: 'nixl-ci-dl-gpu-ep-base',
     tag: "${CI_IMAGE_TAG}",
     arch: "aarch64",
     build_args: '--build-arg NIXL_INSTALL_DIR=${NIXL_INSTALL_DIR} --build-arg PRE_INSTALLED_UCX_ENV=true --build-arg PRE_INSTALLED_NIXL_ENV=true --build-arg BUILD_VLLM_ELASTIC_TEST=true --build-arg VLLM_REF=v0.33.0 --build-arg ARCH=${arch} --pull --no-cache --secret id=ghconfig,src=/tmp/ghconfig',
     credentialsId: 'svc-nixl-github-read-only-token'
    }

  - {
     file: '.ci/dockerfiles/Dockerfile.build_helper',
     name: 'build_helper_dl_ep',
     arch: "aarch64",
     tag: "${CI_IMAGE_TAG}",
     build_args: '--build-arg ARCH=${arch}'
    }

matrix:
  axes:
    arch:
      - aarch64

taskName: "${name}/${arch}/${axis_index}"

steps:
  - name: Compiling NIXL EP Docker Image for VR
    containerSelector: "{name: 'build_helper_dl_ep'}"
    credentialsId:
      - 'svc-nixl-il-artifactory-token'
      - 'svc-nixl-github-read-only-token'
    parallel: false
    run: |
      set -x
      # github.com credential for build.sh's clones, incl. meson's [wrap-git] subprojects ("ghconfig" build secret).
      (. .ci/scripts/common.sh && write_github_gitconfig /tmp/ghconfig)
      # Pass UCX_VERSION only when UCX_VER is set (e.g. nightly master);
      # empty falls back to the Dockerfile ARG UCX_VERSION default so the
      # per-branch default lives in one place.
      UCX_ARG=""
      if [ -n "${UCX_VER}" ]; then UCX_ARG="--build-arg UCX_VERSION=${UCX_VER}"; fi
      export PR_IMAGE=${registry_host}${registry_path}/pr/${arch}/nixl-ci-gpu-vr-ep-test:${BUILD_NUMBER}
      rm -rf /etc/containers/storage.conf && rm -f /usr/share/containers/storage.conf
      set +x -v
      podman build --network host --creds ${REPO_USER}:${REPO_PASS} \
      ${UCX_ARG} \
      --build-arg PRE_INSTALLED_ENV="true" \
      --build-arg NIXL_INSTALL_DIR=${NIXL_INSTALL_DIR} \
      --build-arg NIXL_BUILD_DIR=${NIXL_BUILD_DIR} \
      --build-arg HAS_GPU=true \
      --build-arg BUILD_NIXL_EP=true \
      --build-arg NIXL_PYTHON=${NIXL_EP_PYTHON} \
      --build-arg BASE_IMAGE=${registry_host}${registry_path}/${arch}/nixl-ci-dl-gpu-ep-base:${CI_IMAGE_TAG} \
      --secret id=ghconfig,src=/tmp/ghconfig \
      --tag ${PR_IMAGE} \
      -f .ci/dockerfiles/Dockerfile.gpu-test .
      for i in {1..6}; do
          podman push --creds ${REPO_USER}:${REPO_PASS} ${PR_IMAGE} && break
          [ "$i" = 6 ] && exit 1
          sleep $((2 ** (i - 1)))
      done

  - name: Allocate VR EP Environment
    containerSelector: "{name: 'build_helper_dl_ep'}"
    parallel: false
    shell: action
    module: slurmCI
    run: allocation
    args:
      partition: "${SLURM_PARTITION}"
      headNode: "${SLURM_HEAD_NODE}"
      headUser: "${SLURM_HEAD_USER}"
      nodes: "${SLURM_NODES}"
      jobTimeout: "${SLURM_JOB_TIMEOUT}"
      immediateTimeout: "${SLURM_IMMEDIATE_TIMEOUT}"
      jobName: "${JOB_BASE_NAME}-${BUILD_NUMBER}"
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_ep_${BUILD_NUMBER}.txt"
      credentialsId: "${SSH_CREDENTIALS_ID}"
      extraArgs: [
        "--account=${SLURM_ACCOUNT}",
        "--gres=${SLURM_GRES}",
        "--mem=${SLURM_MEM}",
        "--mincpus=${SLURM_MINCPUS}",
        "--exclude=${SLURM_EXCLUDE}"
      ]

  - name: Sync Container Image
    # Import the image onto the node before the timed test stages, so a slow
    # registry pull is not counted against (and does not time out) a test stage.
    containerSelector: "{name: 'build_helper_dl_ep'}"
    timeout: 30
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_ep_${BUILD_NUMBER}.txt"
      testScript: "hostname; nvidia-smi -L || echo no-gpu-visible; df -h /"
      headNode: "${SLURM_HEAD_NODE}"
      headUser: "${SLURM_HEAD_USER}"
      dockerImage: "${registry_host}#${ARTIFACTORY_PATH}/pr/${arch}/nixl-ci-gpu-vr-ep-test:${BUILD_NUMBER}"
      credentialsId: "${SSH_CREDENTIALS_ID}"
      containerName: "nixl-ci-vr-ep-${BUILD_NUMBER}"

  - name: Run VR NIXL EP tests
    containerSelector: "{name: 'build_helper_dl_ep'}"
    timeout: "${TEST_TIMEOUT}"
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_ep_${BUILD_NUMBER}.txt"
      # TODO: run the vLLM Elastic EP test here too (drop NIXL_EP_SKIP_VLLM_TEST)
      # once VLLM_REF's Triton supports Rubin (sm_107); v0.30.0's Triton 3.7 does not.
      testScript: "NIXL_EP_SKIP_VLLM_TEST=true HF_ENDPOINT=${VLLM_HF_ENDPOINT} HF_HUB_DISABLE_XET=1 .gitlab/test_ep.sh ${NIXL_INSTALL_DIR}"
      headNode: "${SLURM_HEAD_NODE}"
      headUser: "${SLURM_HEAD_USER}"
      dockerImage: "${registry_host}#${ARTIFACTORY_PATH}/pr/${arch}/nixl-ci-gpu-vr-ep-test:${BUILD_NUMBER}"
      credentialsId: "${SSH_CREDENTIALS_ID}"
      containerName: "nixl-ci-vr-ep-${BUILD_NUMBER}"

pipeline_stop:
  containerSelector: "{name: 'build_helper_dl_ep'}"
  parallel: false
  shell: action
  module: slurmCI
  run: stopAllForBuild
  args:
    credentialsId: "${SSH_CREDENTIALS_ID}"
    headNode: "${SLURM_HEAD_NODE}"
    headUser: "${SLURM_HEAD_USER}"
    jobIdDir: "${JOB_ID_FILE_ROOT}"
