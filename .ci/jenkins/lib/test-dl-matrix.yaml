---
#
# Pre-Cluster GPU Test Matrix Configuration (GB200, Lyris)
#
# Key Components:
# - Job Configuration: Defines timeout, failure behavior, and server resources
# - Docker Images: Specifies the container images used for different build stages
# - Matrix Axes: Defines build variations for pre-cluster testing (multi-node, multi-GPU)
# - Run Steps: Sequential steps - build image, then trigger the pre-cluster pipeline and wait
#
# When Modified:
# - Adding/removing Docker images: Affects available test environments
# - Modifying matrix axes: Changes test variations (e.g., adding architectures)
# - Adjusting resource limits: Impacts test performance and resource allocation
# - Adding/removing steps: Changes the test pipeline sequence
#
# Note: Changes to this file are tested as part of the PR CI flow no need to test them manually.


job: nixl-ci-dl-gpu

# Fail job if one of the steps fails or continue
failFast: false

timeout_minutes: 240

registry_host: il.artifactory.nvidia.com
registry_auth: svc-nixl-il-artifactory-token
registry_path: /sw-nbu-swx-nixl-docker-local/ci

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  limits: "{memory: 16Gi, cpu: 16000m}"
  requests: "{memory: 8Gi, cpu: 8000m}"
  privileged: true

credentials:
  - credentialsId: 'svc-nixl-github-read-only-token'
    usernameVariable: 'NIXL_GITHUB_USER'
    passwordVariable: 'NIXL_GITHUB_TOKEN'
  - {credentialsId: 'svc-nixl-il-artifactory-token', usernameVariable: 'REPO_USER', passwordVariable: 'REPO_PASS'}
  - {credentialsId: 'lyris-trigger-token', type: string, variable: 'PRECLUSTER_TRIGGER_TOKEN'}
  - {credentialsId: 'lyris-api-token', type: string, variable: 'PRECLUSTER_API_TOKEN'}

env:
  ARTIFACTORY_PATH: /sw-nbu-swx-nixl-docker-local/ci
  NIXL_INSTALL_DIR: /opt/nixl
  NIXL_BUILD_DIR: nixl_build
  TEST_TIMEOUT: 120
  # Target pre-cluster (GitLab runner tag) + its Slurm partition
  PRECLUSTER: lyris
  PRECLUSTER_PARTITION: gb200
  PRECLUSTER_PIPELINE_REF: main
  # Lyris nodes lack nvidia_peermem, so the cpp VRAM tests cannot register GPU memory there
  PRECLUSTER_ALLOW_FAIL: cpp
  STORAGE_DRIVER: overlay
  # Auto-derived and patched by cidemo-init.sh at CI time from the CI source files;
  # the "CI_MANAGED" placeholder must not be hand-edited.
  CI_IMAGE_TAG: "CI_MANAGED"

empty_volumes:
  - {mountPath: /var/lib/containers/storage, memory: false}

pvc_volumes:
  - {claimName: nbu-swx-nixl-pvc, mountPath: /mnt/pvc, readOnly: false}

# ci-demo builds the images below outside any step; an entry's credentialsId binds
# the token around its build, and this hook writes the git config the Dockerfile
# mounts as the "ghconfig" secret. Left empty when nothing is bound.
pipeline_on_image_build:
  run: |
    #!/bin/bash -e
    . .ci/scripts/common.sh
    write_github_gitconfig /tmp/ghconfig

# Docker images for DL testing
runs_on_dockers:
  - {
     file: '.ci/dockerfiles/Dockerfile.base',
     name: 'nixl-ci-dl-gpu-base',
     tag: "${CI_IMAGE_TAG}",
     arch: "aarch64",
     build_args: '--build-arg NIXL_INSTALL_DIR=${NIXL_INSTALL_DIR} --build-arg PRE_INSTALLED_UCX_ENV=true --build-arg PRE_INSTALLED_NIXL_ENV=true --build-arg ARCH=${arch} --pull --no-cache --secret id=ghconfig,src=/tmp/ghconfig',
     credentialsId: 'svc-nixl-github-read-only-token'
    }

  - {
     file: '.ci/dockerfiles/Dockerfile.build_helper',
     name: 'build_helper_dl',
     arch: "aarch64",
     tag: "${CI_IMAGE_TAG}",
     build_args: '--build-arg ARCH=${arch}'
    }

matrix:
  axes:
    arch:
      - aarch64

taskName: "${name}/${arch}/${axis_index}"

steps:
  - name: Compiling NIXL Docker Image for DL
    containerSelector: "{name: 'build_helper_dl'}"
    credentialsId:
      - 'svc-nixl-il-artifactory-token'
      - 'svc-nixl-github-read-only-token'
    parallel: false
    run: |
      set -x
      # github.com credential for build.sh's clones, incl. meson's [wrap-git] subprojects ("ghconfig" build secret).
      (. .ci/scripts/common.sh && write_github_gitconfig /tmp/ghconfig)
      # Pass UCX_VERSION only when UCX_VER is set (e.g. nightly master);
      # empty falls back to the Dockerfile ARG UCX_VERSION default so the
      # per-branch default lives in one place.
      UCX_ARG=""
      if [ -n "${UCX_VER}" ]; then UCX_ARG="--build-arg UCX_VERSION=${UCX_VER}"; fi
      export PR_IMAGE=${registry_host}${registry_path}/pr/${arch}/nixl-ci-dl-gpu-test:${BUILD_NUMBER}
      rm -rf /etc/containers/storage.conf && rm -f /usr/share/containers/storage.conf
      set +x -v
      podman build --network host --creds ${REPO_USER}:${REPO_PASS} \
      ${UCX_ARG} \
      --build-arg PRE_INSTALLED_ENV="true" \
      --build-arg NIXL_INSTALL_DIR=${NIXL_INSTALL_DIR} \
      --build-arg NIXL_BUILD_DIR=${NIXL_BUILD_DIR} \
      --build-arg HAS_GPU=true \
      --build-arg BASE_IMAGE=${registry_host}${registry_path}/${arch}/nixl-ci-dl-gpu-base:${CI_IMAGE_TAG} \
      --secret id=ghconfig,src=/tmp/ghconfig \
      --tag ${PR_IMAGE} \
      -f .ci/dockerfiles/Dockerfile.gpu-test .
      for i in {1..6}; do
          podman push --creds ${REPO_USER}:${REPO_PASS} ${PR_IMAGE} && break
          [ "$i" = 6 ] && exit 1
          sleep $((2 ** (i - 1)))
      done

  # Runs all four tests in ONE pre-cluster allocation and downloads per-test
  # results into ./results/. Gates on infra only (trigger_and_wait exits 90 on
  # allocation/runner failure); per-test pass/fail is gated by the stages below.
  - name: Run tests on pre-cluster
    containerSelector: "{name: 'build_helper_dl'}"
    timeout: "${TEST_TIMEOUT}"
    parallel: false
    credentialsId: ['lyris-trigger-token', 'lyris-api-token']
    run: |
      set -x
      # test-cmds: "name<TAB>command" per line; per-test env inlined as a prefix.
      printf "python\t.gitlab/test_python.sh ${NIXL_INSTALL_DIR}\n" > tc.txt
      printf "rust\t.gitlab/test_rust.sh ${NIXL_INSTALL_DIR}\n" >> tc.txt
      printf "cpp\tUCX_IB_REG_METHODS=rcache .gitlab/test_cpp.sh ${NIXL_INSTALL_DIR} run_uring\n" >> tc.txt
      printf "nixlbench\tHAS_GPU=false .gitlab/test_nixlbench.sh ${NIXL_INSTALL_DIR}\n" >> tc.txt
      TRIGGER_TOKEN=${PRECLUSTER_TRIGGER_TOKEN} GITLAB_TOKEN=${PRECLUSTER_API_TOKEN} \
      .ci/scripts/trigger_and_wait.sh \
        --ref ${PRECLUSTER_PIPELINE_REF} \
        --cluster ${PRECLUSTER} \
        --partition ${PRECLUSTER_PARTITION} \
        --image "${registry_host}#${ARTIFACTORY_PATH}/pr/${arch}/nixl-ci-dl-gpu-test:${BUILD_NUMBER}" \
        --test-cmds-file tc.txt \
        --allow-fail "${PRECLUSTER_ALLOW_FAIL}" \
        --retries 2

  # Per-test result stages: surface each test's pass/fail from the single run
  # above (they read ./results/<name>.rc, they do not re-run anything).
  - name: Python
    containerSelector: "{name: 'build_helper_dl'}"
    parallel: false
    run: |
      cat results/python.log 2>/dev/null || true
      exit "$(cat results/python.rc 2>/dev/null || echo 1)"

  - name: Rust
    containerSelector: "{name: 'build_helper_dl'}"
    parallel: false
    run: |
      cat results/rust.log 2>/dev/null || true
      exit "$(cat results/rust.rc 2>/dev/null || echo 1)"

  - name: CPP
    containerSelector: "{name: 'build_helper_dl'}"
    parallel: false
    run: |
      cat results/cpp.log 2>/dev/null || true
      rc=$(cat results/cpp.rc 2>/dev/null || echo 1)
      # Quarantined tests (PRECLUSTER_ALLOW_FAIL) report but do not gate
      case " ${PRECLUSTER_ALLOW_FAIL} " in *" cpp "*) echo "cpp is non-gating on ${PRECLUSTER} (rc=${rc})"; rc=0 ;; esac
      exit "$rc"

  - name: Nixlbench
    containerSelector: "{name: 'build_helper_dl'}"
    parallel: false
    run: |
      cat results/nixlbench.log 2>/dev/null || true
      exit "$(cat results/nixlbench.rc 2>/dev/null || echo 1)"
