# Nightly NIXL wheel verification build. Pipeline and this config run from
# main; the source ref (NIXL_VERSION) is cloned into nixl-src, so built refs
# carry no CI config. Wheels publish to
# WHEEL_REPO_URL/verification/g<nixl-sha>.ucx<ucx-sha> (default) or
# WHEEL_REPO_URL/<PUBLISH_DIR>/<build-number> for release runs.
#
# One run builds every CUDA major, so a release folder holds a complete wheel
# set and is owned by this build alone - which is what lets pipeline_stop delete
# it on failure and mark it, only on SUCCESS, for the release poller.

---
job: nixl-ci-build-wheel-nightly

failFast: false
timeout_minutes: 180

# registry_auth/registry_path are what ci-demo pushes wheel_base under; both are
# required now that this job builds an image rather than only pulling.
registry_host: artifactory.nvidia.com
registry_auth: svc-nixl-new-artifactory-token
registry_path: /sw-nbu-swx-nixl-docker-local/ci

credentials:
  - credentialsId: 'svc-nixl-new-artifactory-token'
    usernameVariable: 'ARTIFACTORY_USER'
    passwordVariable: 'ARTIFACTORY_TOKEN'
  - credentialsId: 'svc-nixl-github-read-only-token'
    usernameVariable: 'NIXL_GITHUB_USER'
    passwordVariable: 'NIXL_GITHUB_TOKEN'

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  imagePullSecrets: "['artifactory-pull-secret']"
  limits: '{memory: 24Gi, cpu: 16000m}'
  requests: '{memory: 24Gi, cpu: 16000m}'

# The spcx plugin module is handed over from nixl-ci-compile-ucx-plugin here.
pvc_volumes:
  - {claimName: nbu-swx-nixl-pvc, mountPath: /mnt/pvc, readOnly: false}

# podman-in-container runner; build-container.sh runs docker/podman inside it.
#
# wheel_base is built and pushed by ci-demo before any step runs, then reused by
# every matrix cell via --wheel-base-image: previously each of the twenty cells
# (5 python versions x 2 arches x 2 CUDA majors) compiled the full dependency
# stack from scratch, now it compiles four times. One entry per CUDA major
# because ci-demo keys images on arch alone (gen_image_map), so a single entry
# cannot carry both lines - each is still built once per arch. Every step below
# selects the podman runner explicitly; without a selector a step runs in each
# runner, which would fan the whole matrix out over all three.
# The tag is unique per run (cidemo-init.sh): the nightly rebuilds these every
# time, and they must not collide with the CI_IMAGE_TAG-keyed image that per-PR
# builds cache on.
runs_on_dockers:
  - { name: "manylinux", url: "quay.io/podman/stable:v5.7.1", privileged: true }
  - {
      file: 'contrib/Dockerfile.manylinux',
      name: "${WHEEL_BASE_IMAGE_NAME}-cu12",
      tag: "${WHEEL_BASE_TAG}",
      build_args: '--build-arg BASE_IMAGE=${CU12_BASE_IMAGE} --build-arg BASE_IMAGE_TAG=${CU12_BASE_TAG} --build-arg CUDA_VERSION=${CU12_CUDA_VERSION} --build-arg ARCH=${arch} --build-arg NPROC=${NPROC} --build-arg GRPC_NPROC=${GRPC_NPROC} --target wheel_base'
    }
  - {
      file: 'contrib/Dockerfile.manylinux',
      name: "${WHEEL_BASE_IMAGE_NAME}-cu13",
      tag: "${WHEEL_BASE_TAG}",
      build_args: '--build-arg ARCH=${arch} --build-arg NPROC=${NPROC} --build-arg GRPC_NPROC=${GRPC_NPROC} --target wheel_base'
    }

matrix:
  axes:
    manylinux:
      - "2_28"
    # All Python versions NIXL supports (pyproject requires-python >=3.10).
    python_version:
      - "3.10"
      - "3.11"
      - "3.12"
      - "3.13"
      - "3.14"
    arch:
      - x86_64
      - aarch64
    # Same build, or cu12 and cu13 land in different build-number folders.
    # Not "cuda_major": Jenkins EnvVars is case-insensitive, so that name
    # collides with the CUDA_MAJOR job parameter and the axis never reaches the
    # shell - the leg is still labelled correctly, since taskName is rendered
    # from the axis map rather than from the environment.
    cuda:
      - "12"
      - "13"

env:
  NPROC: 16
  GRPC_NPROC: 10
  # CUDA 12 base image is pinned here (unlikely to change); CUDA 13 passes
  # nothing and relies on build-container.sh's own default.
  CU12_BASE_IMAGE: "nvcr.io/nvidia/cuda"
  CU12_BASE_TAG: "12.9.1-devel-ubi8"
  CU12_CUDA_VERSION: "12.9"
  # Unique per run, patched by cidemo-init.sh before the matrix is read.
  # The NIGHTLY_MANAGED placeholder must not be hand-edited.
  WHEEL_BASE_IMAGE_NAME: "nixl-wheel-base-nightly-manylinux_2_28"
  WHEEL_BASE_TAG: "NIGHTLY_MANAGED_WHEEL_BASE_TAG"
  # UCX spcx plugin: compiled by nixl-ci-compile-ucx-plugin against the
  # wheel_base images above and staged per-arch on the shared PVC. Which plugin
  # ref gets built is that job's own default, owned by the plugin developers.
  SPCX_STAGING_ROOT: "/mnt/pvc/${JOB_BASE_NAME}-spcx"
  WHEEL_IMAGE_TAG: "nixl-wheel:build"   # constant: each matrix cell is its own pod
  # SWX team's NIXL pypi repo (publish target).
  WHEEL_REPO_URL: "https://artifactory.nvidia.com/artifactory/sw-nbu-swx-nixl-pypi-local"
  # Properties API (same repo, different endpoint) for tagging published wheels.
  WHEEL_REPO_API: "https://artifactory.nvidia.com/artifactory/api/storage/sw-nbu-swx-nixl-pypi-local"
  # Browsable tree view of the same repo, for the per-build link in the UI.
  WHEEL_REPO_UI: "https://artifactory.nvidia.com/ui/repos/tree/General/sw-nbu-swx-nixl-pypi-local"
  # Source repo cloned in Build Wheel.
  NIXL_REPO_URL: "https://github.com/ai-dynamo/nixl.git"
  MAIL_FROM: "jenkins@nvidia.com"

steps:
  - name: Prepare
    containerSelector: "{name: 'manylinux'}"
    credentialsId:
      - 'svc-nixl-new-artifactory-token'
      - 'svc-nixl-github-read-only-token'
    parallel: false
    run: |
      # Set up podman and log in to Artifactory (base image pull)
      rm -f /etc/containers/storage.conf /usr/share/containers/storage.conf
      podman system reset -f || true
      ln -sfT $(type -p podman) /usr/bin/docker
      # github.com credential, used as the "ghconfig" build secret and by the
      # agent-side clones below.
      . .ci/scripts/common.sh
      write_github_gitconfig /tmp/ghconfig
      echo "$ARTIFACTORY_TOKEN" | docker login "https://${registry_host}" -u "$ARTIFACTORY_USER" --password-stdin

  - name: Checkout Source
    containerSelector: "{name: 'manylinux'}"
    parallel: false
    run: |
      # Clone the built source (contrib scripts + Dockerfile come from this
      # ref; CI config stays on main). Split from Build Wheel so a checkout
      # failure is triaged separately from a build failure.
      set -x
      # The Jenkins checkout is owned by a different uid; trust only it.
      git config --global --add safe.directory "${PWD}"
      # Full clone: build-container.sh derives a version label via
      # `git describe --tags`, which needs history + tags, not just the tree.
      rm -rf nixl-src
      git -c include.path=/tmp/ghconfig clone "${NIXL_REPO_URL}" nixl-src
      # fetch covers branch/tag/PR refs; the fallback covers raw shas. Fail
      # loud if neither resolves, so we never silently build the clone default.
      if git -C nixl-src fetch origin "${NIXL_VERSION}" 2>/dev/null; then
        git -C nixl-src checkout --detach FETCH_HEAD
      else
        git -C nixl-src checkout --detach "${NIXL_VERSION}" \
          || { echo "ERROR: cannot resolve NIXL_VERSION=${NIXL_VERSION}"; exit 1; }
      fi
      # Exact first 8 hex for the publish folder key (--short=8 is a minimum
      # and can extend on ambiguity).
      NIXL_SHA="$(git -C nixl-src rev-parse HEAD | cut -c1-8)"
      # Carried to Publish (folder key). UCX ref is not pinned here; it's
      # build-container.sh's own default and gets recorded in
      # build_options.env by the Build Wheel step instead.
      printf 'NIXL_SHA=%s\n' "${NIXL_SHA}" > wheel_build_ids.env

  - name: Build Wheel
    containerSelector: "{name: 'manylinux'}"
    parallel: false
    run: |
      # Build the wheel image from the checked-out nixl-src. --tag pins the
      # image so Publish extracts dist/. No gitlab credentials: the plugin is
      # not cloned here, nixl-ci-compile-ucx-plugin compiled it.
      set -x
      # Infinia is always bundled in the nightly; the built source ref's
      # build-container.sh pins the image. The spcx plugin is not built here -
      # it was compiled against the same wheel_base and comes off the PVC.
      # The two CUDA majors have different torch coverage: 2.11 is not available
      # on the cu13 index, and 2.14 is not available on the cu12 one.
      # Never default the CUDA line: an unset axis falling through to cu13 made
      # both cells build cu13 under identical filenames, so each overwrote the
      # other and the folder silently held half a set.
      case "${cuda}" in
        12)
          BASE_IMAGE_FLAGS="--base-image ${CU12_BASE_IMAGE} --base-image-tag ${CU12_BASE_TAG} --cuda-version ${CU12_CUDA_VERSION}"
          TORCH_VERSIONS="2.11,2.12,2.13"
          ;;
        13)
          BASE_IMAGE_FLAGS=""
          TORCH_VERSIONS="2.12,2.13,2.14"
          ;;
        *)
          echo "ERROR: cuda is '${cuda:-<unset>}', expected 12 or 13"
          exit 1
          ;;
      esac
      export DOCKER_BUILD_EXTRA_ARGS="--secret id=ghconfig,src=/tmp/ghconfig"
      cd nixl-src
      ./contrib/build-container.sh \
        ${BASE_IMAGE_FLAGS} \
        --wheel-base "manylinux_${manylinux}" \
        --python-versions "${python_version}" \
        --arch ${arch} \
        --torch-versions "${TORCH_VERSIONS}" \
        --tag "${WHEEL_IMAGE_TAG}" \
        --dockerfile contrib/Dockerfile.manylinux \
        --wheel-base-image "${registry_host}${registry_path}/${arch}/${WHEEL_BASE_IMAGE_NAME}-cu${cuda}:${WHEEL_BASE_TAG}" \
        --ucx-spcx-plugin-install "${SPCX_STAGING_ROOT}/${BUILD_NUMBER}/cu${cuda}/${arch}" \
        --build-infinia \
        --build-options-file ../build_options.env

  - name: Publish
    containerSelector: "{name: 'manylinux'}"
    credentialsId: 'svc-nixl-new-artifactory-token'
    parallel: false
    run: |
      set -x
      # Extract the wheels from the built image, then upload.
      rm -rf dist && mkdir -p dist
      cid=$(docker create "${WHEEL_IMAGE_TAG}")
      docker cp "${cid}:/workspace/nixl/dist/." ./dist/
      docker rm -f "${cid}" || true
      ls -l dist/

      # Nightly runs leave PUBLISH_DIR empty and publish to verification/;
      # manual release runs can pass release/<ver>. Allowlist it - the URL is
      # PUT with the service token, and a path like ../<other-repo> would
      # normalize into a different Artifactory repo.
      PUBLISH_DIR="${PUBLISH_DIR:-verification}"
      [[ "${PUBLISH_DIR}" =~ ^(verification|release/[A-Za-z0-9][A-Za-z0-9._-]*)$ ]] \
        || { echo "ERROR: invalid PUBLISH_DIR '${PUBLISH_DIR}'"; exit 1; }
      . ./wheel_build_ids.env

      # Outside the build_options.env guard below: the release folder no longer
      # carries the sha, so NIXL_SHA must be set even for a ref that predates
      # --build-options-file.
      PROPERTIES="NIXL_SHA=${NIXL_SHA}"
      PROPERTIES+=";NIXL_VERSION=${NIXL_VERSION}"
      PROPERTIES+=";JOB_NAME=${JOB_NAME}"
      PROPERTIES+=";BUILD_NUMBER=${BUILD_NUMBER}"

      # Provenance recorded by Build Wheel (contrib/build-container.sh
      # --build-options-file). Only set properties for values that exist,
      # so an older built ref without this flag just skips them.
      if [ -f build_options.env ]; then
        . ./build_options.env
        [ -n "${UCX_REF:-}" ] && PROPERTIES+=";UCX_REF=${UCX_REF}"
        [ -n "${UCX_SHA:-}" ] && PROPERTIES+=";UCX_SHA=${UCX_SHA}"
        [ -n "${CUDA_VERSION:-}" ] && PROPERTIES+=";CUDA_VERSION=${CUDA_VERSION}"
        [ "${BUILD_UCX_SPCX_PLUGIN:-}" = "true" ] && [ -n "${UCX_SPCX_PLUGIN_REF:-}" ] \
          && PROPERTIES+=";UCX_SPCX_PLUGIN_REF=${UCX_SPCX_PLUGIN_REF}"
        [ "${BUILD_INFINIA:-}" = "true" ] && [ -n "${INFINIA_LIBS_IMAGE:-}" ] \
          && PROPERTIES+=";INFINIA_LIBS_IMAGE=${INFINIA_LIBS_IMAGE}"
        # A trailing `[ ... ] && ...` that does not fire would otherwise leave
        # the whole if-block with a non-zero status.
        true
      fi

      # verification/ keeps its g<nixl-sha>.ucx<ucx-sha> schema (consumed by the
      # build-llm-container verification pipeline) and is shared between builds;
      # release/<ver> gets one folder per build.
      if [ "${PUBLISH_DIR}" = "verification" ]; then
        [ -n "${UCX_SHA:-}" ] || { echo "ERROR: verification publish needs UCX_SHA from build_options.env"; exit 1; }
        FOLDER="g${NIXL_SHA}.ucx${UCX_SHA}"
      else
        FOLDER="${BUILD_NUMBER}"
      fi
      DEST="${WHEEL_REPO_URL}/${PUBLISH_DIR}/${FOLDER}"
      PROPS_DEST="${WHEEL_REPO_API}/${PUBLISH_DIR}/${FOLDER}"

      # curl-PUT (no python on the runner for twine); Artifactory indexes it as a
      # pip repo. rc fails the step on any upload error; set +x hides the token.
      set +x
      rc=0
      for whl in dist/nixl*.whl; do
        curl -fsSL -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
          -T "${whl}" "${DEST}/$(basename "${whl}")" || rc=1
        curl -fsSL -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" -X PUT \
          "${PROPS_DEST}/$(basename "${whl}")?properties=${PROPERTIES}" || rc=1
      done
      exit $rc

taskName: '${name}_${manylinux}/${arch}/python_${python_version}/cu${cuda}'

# Display name distinguishes builds in the history list: #N-<source>.
pipeline_start:
  shell: action
  module: groovy
  containerSelector: "{name: 'manylinux'}"
  run: |
    def src = params.NIXL_VERSION ==~ /[0-9a-f]{40}/ ? params.NIXL_VERSION.take(8) : params.NIXL_VERSION
    currentBuild.displayName += "-${src}"

    // Compile the closed-source UCX spcx plugin against the wheel_base images
    // ci-demo just pushed, before any wheel is built. The job lives in the
    // plugin repo, so this passes an image name and tag and gets back only the
    // built module (on the PVC) and a result. Once per CUDA major: the module
    // links that image's UCX, so a cu12 wheel cannot take the cu13 build.
    for (cuda in ["12", "13"]) {
      def staging = "${env.SPCX_STAGING_ROOT}/${env.BUILD_NUMBER}/cu${cuda}"
      def res = build job: 'nixl-ci-compile-ucx-plugin',
        parameters: [
          string(name: 'WHEEL_BASE_NAME', value: "${env.WHEEL_BASE_IMAGE_NAME}-cu${cuda}"),
          string(name: 'WHEEL_BASE_TAG',  value: env.WHEEL_BASE_TAG),
          string(name: 'STAGING_DIR',     value: staging),
        ],
        propagate: false, wait: true
      echo "UCX spcx plugin compile (cu${cuda}): ${res.result} (${res.absoluteUrl})"
      if (res.result != 'SUCCESS') {
        error("UCX spcx plugin failed to compile against ${env.WHEEL_BASE_IMAGE_NAME}-cu${cuda}:${env.WHEEL_BASE_TAG} - see ${res.absoluteUrl}")
      }
    }

# Settles the release folder - mark on SUCCESS, delete otherwise - then mails
# the unattended nightly only when it fails. A partial wheel set has to be
# rebuilt anyway, so publishing it would only mislead the poller. verification/
# folders are shared between builds and are left alone either way.
pipeline_stop:
  shell: action
  module: groovy
  containerSelector: "{name: 'manylinux'}"
  run: |
    def jobStatus = currentBuild.result ?: 'SUCCESS'
    def publishDir = params.PUBLISH_DIR ?: ''
    // Publish's allowlist, not just a release/ prefix test: this builds a
    // credentialed DELETE, and curl normalizes dot segments, so
    // release/x/../../../<other-repo> would escape into a different repo.
    def isRelease = publishDir ==~ /release\/[A-Za-z0-9][A-Za-z0-9._-]*/
    if (!isRelease && publishDir.startsWith('release/')) {
        echo "PUBLISH_DIR '${publishDir}' is not a valid release path - skipping folder settlement"
    }
    def folderPath = "${publishDir}/${env.BUILD_NUMBER}"
    def folderUrl = "${env.WHEEL_REPO_UI}/${folderPath}"
    def removedNote = ''

    if (isRelease) {
        withCredentials([usernamePassword(
                credentialsId: 'svc-nixl-new-artifactory-token',
                usernameVariable: 'ARTIFACTORY_USER',
                passwordVariable: 'ARTIFACTORY_TOKEN')]) {
            // Checks the status code, not curl's exit status: without -f curl
            // exits 0 on an HTTP error and a surviving folder reads as deleted.
            def dropFolder = {
                def code = sh(returnStdout: true, script: """
                    set +x
                    curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
                      -u "\$ARTIFACTORY_USER:\$ARTIFACTORY_TOKEN" \
                      -X DELETE "${env.WHEEL_REPO_URL}/${folderPath}"
                """).trim()
                if (code in ['200', '204']) {
                    echo "Removed ${folderPath}"
                    return true
                }
                if (code == '404') {
                    echo "Nothing to remove at ${folderPath}"
                    return true
                }
                echo "WARNING: DELETE ${folderPath} returned ${code} - it may still be published"
                return false
            }

            if (jobStatus == 'SUCCESS') {
                // The poller always passes a full sha; a manual run naming a
                // branch/tag needs one ls-remote.
                def sha = params.NIXL_VERSION ==~ /[0-9a-f]{40}/
                    ? params.NIXL_VERSION.take(8)
                    : sh(returnStdout: true, script: """
                          git ls-remote "${env.NIXL_REPO_URL}" "${params.NIXL_VERSION}" \
                            | head -1 | cut -c1-8
                      """).trim()
                if (!sha) {
                    error("cannot resolve NIXL_SHA for the ${folderPath} completion marker")
                }
                try {
                    // recursive=0: the properties API defaults to recursive and
                    // would stamp this over each wheel's own NIXL_SHA.
                    sh """
                        set +x
                        curl -fsSL --retry 3 --retry-delay 2 \
                          -u "\$ARTIFACTORY_USER:\$ARTIFACTORY_TOKEN" -X PUT \
                          "${env.WHEEL_REPO_API}/${folderPath}?properties=NIXL_SHA=${sha}&recursive=0"
                    """
                    currentBuild.description = "<a href='${folderUrl}'>${folderPath}</a>"
                    echo "Published wheel set: ${folderUrl} (NIXL_SHA=${sha})"
                } catch (err) {
                    // Unmarked, nothing purges release/, and the commit gets
                    // rebuilt anyway - so drop it rather than orphan it.
                    echo "Could not mark ${folderPath} - removing it"
                    dropFolder()
                    throw err
                }
            } else {
                removedNote = dropFolder()
                    ? "<p>Partial wheel set removed: <b>${folderPath}</b></p>"
                    : "<p>Partial wheel set at <b>${folderPath}</b> could NOT be removed - delete it manually</p>"
            }
        }
    }

    if (jobStatus != 'SUCCESS' && params.MAIL_TO) {
        def userName = currentBuild.rawBuild.getCause(hudson.model.Cause.UserIdCause)?.userName ?: 'schedule'
        mail(
            from: env.MAIL_FROM,
            to: params.MAIL_TO,
            subject: "Job '${env.JOB_NAME} [${env.BUILD_NUMBER}]' - ${jobStatus}",
            mimeType: 'text/html',
            body: """
                <p>Started by: <b>${userName}</b></p>
                <p>Status: <span style="color: red;"><b>${jobStatus}</b></span></p>
                <p>Job: <a href='${env.JOB_URL}'>${env.JOB_NAME}</a></p>
                <p>Build: <a href='${env.BUILD_URL}'>#${env.BUILD_NUMBER}</a></p>
                <p>Console Output: <a href='${env.BUILD_URL}console'>Full Log</a></p>
                <p>NIXL Version: <b>${params.NIXL_VERSION}</b></p>
                ${removedNote}
            """
        )
    }
