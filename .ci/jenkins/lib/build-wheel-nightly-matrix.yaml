# Nightly NIXL wheel verification build. Pipeline and this config run from
# main; the source ref (NIXL_VERSION) is cloned into nixl-src, so built refs
# carry no CI config. Wheels publish to
# WHEEL_REPO_URL/verification/g<nixl-sha>.ucx<ucx-sha> (default) or
# WHEEL_REPO_URL/<PUBLISH_DIR>/<nixl-sha> for manual release runs.

---
job: nixl-ci-build-wheel-nightly

failFast: false
timeout_minutes: 180

registry_host: artifactory.nvidia.com

credentials:
  - credentialsId: 'svc-nixl-new-artifactory-token'
    usernameVariable: 'ARTIFACTORY_USER'
    passwordVariable: 'ARTIFACTORY_TOKEN'
  - credentialsId: 'svc-nixl-gitlab-token'
    usernameVariable: 'NIXL_GITLAB_USER'
    passwordVariable: 'NIXL_GITLAB_TOKEN'
  # Paired with NIXL_GITLAB_TOKEN; only read on the spcx path.
  - credentialsId: 'ucx-plugin-gitlab-url'
    type: 'string'
    variable: 'NIXL_SPCX_PLUGIN_REPO_URL'

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  imagePullSecrets: "['artifactory-pull-secret']"
  limits: '{memory: 24Gi, cpu: 16000m}'
  requests: '{memory: 24Gi, cpu: 16000m}'

# podman-in-container runner; build-container.sh runs docker/podman inside it.
# The nightly builds wheel_base from scratch on every run — no caching.
runs_on_dockers:
  - { name: "manylinux", url: "quay.io/podman/stable:v5.7.1", privileged: true }

matrix:
  axes:
    manylinux:
      - "2_28"
    # All Python versions NIXL supports (pyproject requires-python >=3.10).
    python_version:
      - "3.10"
      - "3.11"
      - "3.12"
      - "3.13"
      - "3.14"
    arch:
      - x86_64
      - aarch64

env:
  NPROC: 16
  GRPC_NPROC: 10
  # CUDA 12 base image is pinned here (unlikely to change); CUDA 13 passes
  # nothing and relies on build-container.sh's own default.
  CU12_BASE_IMAGE: "nvcr.io/nvidia/cuda"
  CU12_BASE_TAG: "12.9.1-devel-ubi8"
  CU12_CUDA_VERSION: "12.9"
  WHEEL_IMAGE_TAG: "nixl-wheel:build"   # constant: each matrix cell is its own pod
  # SWX team's NIXL pypi repo (publish target).
  WHEEL_REPO_URL: "https://artifactory.nvidia.com/artifactory/sw-nbu-swx-nixl-pypi-local"
  # Properties API (same repo, different endpoint) for tagging published wheels.
  WHEEL_REPO_API: "https://artifactory.nvidia.com/artifactory/api/storage/sw-nbu-swx-nixl-pypi-local"
  # Source repo cloned in Build Wheel.
  NIXL_REPO_URL: "https://github.com/ai-dynamo/nixl.git"
  MAIL_FROM: "jenkins@nvidia.com"

steps:
  - name: Prepare
    credentialsId: 'svc-nixl-new-artifactory-token'
    parallel: false
    run: |
      # Set up podman and log in to Artifactory (base image pull)
      rm -f /etc/containers/storage.conf /usr/share/containers/storage.conf
      podman system reset -f || true
      ln -sfT $(type -p podman) /usr/bin/docker
      echo "$ARTIFACTORY_TOKEN" | docker login "https://${registry_host}" -u "$ARTIFACTORY_USER" --password-stdin

  - name: Checkout Source
    parallel: false
    run: |
      # Clone the built source (contrib scripts + Dockerfile come from this
      # ref; CI config stays on main). Split from Build Wheel so a checkout
      # failure is triaged separately from a build failure.
      set -x
      # The Jenkins checkout is owned by a different uid; trust only it.
      git config --global --add safe.directory "${PWD}"
      # Full clone: build-container.sh derives a version label via
      # `git describe --tags`, which needs history + tags, not just the tree.
      rm -rf nixl-src
      git clone "${NIXL_REPO_URL}" nixl-src
      # fetch covers branch/tag/PR refs; the fallback covers raw shas. Fail
      # loud if neither resolves, so we never silently build the clone default.
      if git -C nixl-src fetch origin "${NIXL_VERSION}" 2>/dev/null; then
        git -C nixl-src checkout --detach FETCH_HEAD
      else
        git -C nixl-src checkout --detach "${NIXL_VERSION}" \
          || { echo "ERROR: cannot resolve NIXL_VERSION=${NIXL_VERSION}"; exit 1; }
      fi
      # Exact first 8 hex for the publish folder key (--short=8 is a minimum
      # and can extend on ambiguity).
      NIXL_SHA="$(git -C nixl-src rev-parse HEAD | cut -c1-8)"
      # Carried to Publish (folder key). UCX ref is not pinned here; it's
      # build-container.sh's own default and gets recorded in
      # build_options.env by the Build Wheel step instead.
      printf 'NIXL_SHA=%s\n' "${NIXL_SHA}" > wheel_build_ids.env

  - name: Build Wheel
    credentialsId:
      - 'svc-nixl-gitlab-token'
      - 'ucx-plugin-gitlab-url'
    parallel: false
    run: |
      # Build the wheel image from the checked-out nixl-src. --tag pins the
      # image so Publish extracts dist/. Plugin creds bind only here.
      set -x
      # spcx and Infinia are always bundled in the nightly; the built source
      # ref's build-container.sh pins the plugin ref/image.
      # The two CUDA majors have different torch coverage: 2.11 is not available
      # on the cu13 index, and 2.14 is not available on the cu12 one.
      BASE_IMAGE_FLAGS=""
      if [ "${CUDA_MAJOR}" = "12" ]; then
        BASE_IMAGE_FLAGS="--base-image ${CU12_BASE_IMAGE} --base-image-tag ${CU12_BASE_TAG} --cuda-version ${CU12_CUDA_VERSION}"
        TORCH_VERSIONS="2.11,2.12,2.13"
      else
        TORCH_VERSIONS="2.12,2.13,2.14"
      fi
      cd nixl-src
      ./contrib/build-container.sh \
        ${BASE_IMAGE_FLAGS} \
        --wheel-base "manylinux_${manylinux}" \
        --python-versions "${python_version}" \
        --arch ${arch} \
        --torch-versions "${TORCH_VERSIONS}" \
        --tag "${WHEEL_IMAGE_TAG}" \
        --dockerfile contrib/Dockerfile.manylinux \
        --build-ucx-spcx-plugin \
        --build-infinia \
        --build-options-file ../build_options.env

  - name: Publish
    credentialsId: 'svc-nixl-new-artifactory-token'
    parallel: false
    run: |
      set -x
      # Extract the wheels from the built image, then upload.
      rm -rf dist && mkdir -p dist
      cid=$(docker create "${WHEEL_IMAGE_TAG}")
      docker cp "${cid}:/workspace/nixl/dist/." ./dist/
      docker rm -f "${cid}" || true
      ls -l dist/

      # Nightly runs leave PUBLISH_DIR empty and publish to verification/;
      # manual release runs can pass release/<ver>. Allowlist it - the URL is
      # PUT with the service token, and a path like ../<other-repo> would
      # normalize into a different Artifactory repo.
      PUBLISH_DIR="${PUBLISH_DIR:-verification}"
      [[ "${PUBLISH_DIR}" =~ ^(verification|release/[A-Za-z0-9][A-Za-z0-9._-]*)$ ]] \
        || { echo "ERROR: invalid PUBLISH_DIR '${PUBLISH_DIR}'"; exit 1; }
      . ./wheel_build_ids.env

      # Provenance recorded by Build Wheel (contrib/build-container.sh
      # --build-options-file). Only set properties for values that exist,
      # so an older built ref without this flag just skips them.
      PROPERTIES=""
      if [ -f build_options.env ]; then
        . ./build_options.env
        [ -n "${UCX_REF:-}" ] && PROPERTIES+=";UCX_REF=${UCX_REF}"
        [ -n "${UCX_SHA:-}" ] && PROPERTIES+=";UCX_SHA=${UCX_SHA}"
        [ -n "${CUDA_VERSION:-}" ] && PROPERTIES+=";CUDA_VERSION=${CUDA_VERSION}"
        [ "${BUILD_UCX_SPCX_PLUGIN:-}" = "true" ] && [ -n "${UCX_SPCX_PLUGIN_REF:-}" ] \
          && PROPERTIES+=";UCX_SPCX_PLUGIN_REF=${UCX_SPCX_PLUGIN_REF}"
        [ "${BUILD_INFINIA:-}" = "true" ] && [ -n "${INFINIA_LIBS_IMAGE:-}" ] \
          && PROPERTIES+=";INFINIA_LIBS_IMAGE=${INFINIA_LIBS_IMAGE}"
        PROPERTIES="${PROPERTIES#;}"
      fi

      # verification/ keeps its long-standing g<nixl-sha>.ucx<ucx-sha> folder
      # schema (consumed by the build-llm-container verification pipeline);
      # release/<ver> co-locates cu12/cu13 by nixl-sha alone, unkeyed to UCX.
      if [ "${PUBLISH_DIR}" = "verification" ]; then
        [ -n "${UCX_SHA:-}" ] || { echo "ERROR: verification publish needs UCX_SHA from build_options.env"; exit 1; }
        FOLDER="g${NIXL_SHA}.ucx${UCX_SHA}"
      else
        FOLDER="${NIXL_SHA}"
      fi
      DEST="${WHEEL_REPO_URL}/${PUBLISH_DIR}/${FOLDER}"
      PROPS_DEST="${WHEEL_REPO_API}/${PUBLISH_DIR}/${FOLDER}"

      # curl-PUT (no python on the runner for twine); Artifactory indexes it as a
      # pip repo. rc fails the step on any upload error; set +x hides the token.
      set +x
      rc=0
      for whl in dist/nixl*.whl; do
        curl -fsSL -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
          -T "${whl}" "${DEST}/$(basename "${whl}")" || rc=1
        if [ -n "${PROPERTIES}" ]; then
          curl -fsSL -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" -X PUT \
            "${PROPS_DEST}/$(basename "${whl}")?properties=${PROPERTIES}" || rc=1
        fi
      done
      exit $rc

taskName: '${name}_${manylinux}/${arch}/python_${python_version}'

# Display name distinguishes builds in the history list: #N-<source>-cuXX.
pipeline_start:
  shell: action
  module: groovy
  containerSelector: "{name: 'manylinux'}"
  run: |
    def src = params.NIXL_VERSION ==~ /[0-9a-f]{40}/ ? params.NIXL_VERSION.take(8) : params.NIXL_VERSION
    def cu = "cu${params.CUDA_MAJOR}"
    currentBuild.displayName += "-${src}-${cu}"

# Mail the unattended nightly only when it fails; a green night stays quiet.
pipeline_stop:
  shell: action
  module: groovy
  containerSelector: "{name: 'manylinux'}"
  run: |
    def jobStatus = currentBuild.result ?: 'SUCCESS'
    if (jobStatus != 'SUCCESS' && params.MAIL_TO) {
        def userName = currentBuild.rawBuild.getCause(hudson.model.Cause.UserIdCause)?.userName ?: 'schedule'
        mail(
            from: env.MAIL_FROM,
            to: params.MAIL_TO,
            subject: "Job '${env.JOB_NAME} [${env.BUILD_NUMBER}]' - ${jobStatus}",
            mimeType: 'text/html',
            body: """
                <p>Started by: <b>${userName}</b></p>
                <p>Status: <span style="color: red;"><b>${jobStatus}</b></span></p>
                <p>Job: <a href='${env.JOB_URL}'>${env.JOB_NAME}</a></p>
                <p>Build: <a href='${env.BUILD_URL}'>#${env.BUILD_NUMBER}</a></p>
                <p>Console Output: <a href='${env.BUILD_URL}console'>Full Log</a></p>
                <p>NIXL Version: <b>${params.NIXL_VERSION}</b></p>
                <p>CUDA Major: <b>${params.CUDA_MAJOR}</b></p>
            """
        )
    }
