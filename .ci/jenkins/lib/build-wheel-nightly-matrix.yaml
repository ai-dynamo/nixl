# Nightly NIXL wheel verification build. Pipeline and this config run from
# main; the source ref (NIXL_VERSION) is cloned into nixl-src, so built refs
# carry no CI config. Wheels publish to
# WHEEL_REPO_URL/verification/g<nixl-sha>.ucx<ucx-sha> (default) or
# WHEEL_REPO_URL/<PUBLISH_DIR>/<build-number> for release runs.
#
# One run builds every CUDA major, so a release folder holds a complete wheel
# set and is owned by this build alone - which is what lets pipeline_stop delete
# it on failure and mark it, only on SUCCESS, for the release poller.

---
job: nixl-ci-build-wheel-nightly

failFast: false
timeout_minutes: 180

# registry_auth/registry_path are what ci-demo pushes wheel_base under; both are
# required now that this job builds an image rather than only pulling.
registry_host: il.artifactory.nvidia.com
registry_auth: svc-nixl-il-artifactory-token
registry_path: /sw-nbu-swx-nixl-docker-local/ci

credentials:
  # IL: wheel_base (CI image). artifactory.nvidia.com: wheel publishing.
  - credentialsId: 'svc-nixl-il-artifactory-token'
    usernameVariable: 'ARTIFACTORY_USER'
    passwordVariable: 'ARTIFACTORY_TOKEN'
  - credentialsId: 'svc-nixl-new-artifactory-token'
    usernameVariable: 'ARTIFACTORY_USER'
    passwordVariable: 'ARTIFACTORY_TOKEN'
  - credentialsId: 'svc-nixl-github-read-only-token'
    usernameVariable: 'NIXL_GITHUB_USER'
    passwordVariable: 'NIXL_GITHUB_TOKEN'

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  limits: '{memory: 24Gi, cpu: 16000m}'
  requests: '{memory: 24Gi, cpu: 16000m}'

# The spcx plugin module is handed over from nixl-ci-compile-ucx-plugin here.
pvc_volumes:
  - {claimName: nbu-swx-nixl-pvc, mountPath: /mnt/pvc, readOnly: false}

# podman-in-container runner; build-container.sh runs docker/podman inside it.
#
# wheel_base is built and pushed by ci-demo before any step runs, then reused by
# every matrix cell via --wheel-base-image: previously each of the twenty cells
# (5 python versions x 2 arches x 2 CUDA majors) compiled the full dependency
# stack from scratch, now it compiles four times. One entry per CUDA major
# because ci-demo keys images on arch alone (gen_image_map), so a single entry
# cannot carry both lines - each is still built once per arch. Every step below
# selects the podman runner explicitly; without a selector a step runs in each
# runner, which would fan the whole matrix out over all three.
# The tag is unique per run (cidemo-init.sh): the nightly rebuilds these every
# time, and they must not collide with the CI_IMAGE_TAG-keyed image that per-PR
# builds cache on.
runs_on_dockers:
  - { name: "manylinux", url: "quay.io/podman/stable:v5.7.1", privileged: true }
  - {
      file: 'contrib/Dockerfile.manylinux',
      name: "${WHEEL_BASE_IMAGE_NAME}-cu12",
      tag: "${WHEEL_BASE_TAG}",
      build_args: '--build-arg BASE_IMAGE=${CU12_BASE_IMAGE} --build-arg BASE_IMAGE_TAG=${CU12_BASE_TAG} --build-arg CUDA_VERSION=${CU12_CUDA_VERSION} --build-arg ARCH=${arch} --build-arg NPROC=${NPROC} --build-arg GRPC_NPROC=${GRPC_NPROC} --target wheel_base'
    }
  - {
      file: 'contrib/Dockerfile.manylinux',
      name: "${WHEEL_BASE_IMAGE_NAME}-cu13",
      tag: "${WHEEL_BASE_TAG}",
      build_args: '--build-arg ARCH=${arch} --build-arg NPROC=${NPROC} --build-arg GRPC_NPROC=${GRPC_NPROC} --target wheel_base'
    }

matrix:
  axes:
    manylinux:
      - "2_28"
    # All Python versions NIXL supports (pyproject requires-python >=3.10).
    python_version:
      - "3.10"
      - "3.11"
      - "3.12"
      - "3.13"
      - "3.14"
    arch:
      - x86_64
      - aarch64
    # Same build, or cu12 and cu13 land in different build-number folders.
    # Not "cuda_major": Jenkins EnvVars is case-insensitive, so that name
    # collides with the CUDA_MAJOR job parameter and the axis never reaches the
    # shell - the leg is still labelled correctly, since taskName is rendered
    # from the axis map rather than from the environment.
    cuda:
      - "12"
      - "13"

env:
  NPROC: 16
  GRPC_NPROC: 10
  # CUDA 12 base image is pinned here (unlikely to change); CUDA 13 passes
  # nothing and relies on the Dockerfile's own ARG default, which
  # build-container.sh records in build_options.env.
  CU12_BASE_IMAGE: "nvcr.io/nvidia/cuda"
  CU12_BASE_TAG: "12.9.1-devel-ubi8"
  CU12_CUDA_VERSION: "12.9"
  # Unique per run, patched by cidemo-init.sh before the matrix is read.
  # The NIGHTLY_MANAGED placeholder must not be hand-edited.
  WHEEL_BASE_IMAGE_NAME: "nixl-wheel-base-nightly-manylinux_2_28"
  WHEEL_BASE_TAG: "NIGHTLY_MANAGED_WHEEL_BASE_TAG"
  # UCX spcx plugin: compiled by nixl-ci-compile-ucx-plugin against the
  # wheel_base images above and staged per-arch on the shared PVC. Which plugin
  # ref gets built is that job's own default, owned by the plugin developers.
  SPCX_STAGING_ROOT: "/mnt/pvc/${JOB_BASE_NAME}-spcx"
  # Per-cell provenance fragments, merged by pipeline_stop into the build
  # manifest and removed again on every run.
  MANIFEST_STAGING_ROOT: "/mnt/pvc/${JOB_BASE_NAME}-manifest"
  # Product of the matrix axes above - update both together. pipeline_stop
  # refuses to publish a manifest assembled from fewer fragments.
  EXPECTED_WHEEL_CELLS: "20"
  WHEEL_IMAGE_TAG: "nixl-wheel:build"   # constant: each matrix cell is its own pod
  # SWX team's NIXL pypi repo (publish target).
  WHEEL_REPO_URL: "https://artifactory.nvidia.com/artifactory/sw-nbu-swx-nixl-pypi-local"
  # Properties API (same repo, different endpoint) for tagging published wheels.
  WHEEL_REPO_API: "https://artifactory.nvidia.com/artifactory/api/storage/sw-nbu-swx-nixl-pypi-local"
  # Browsable tree view of the same repo, for the per-build link in the UI.
  WHEEL_REPO_UI: "https://artifactory.nvidia.com/ui/repos/tree/General/sw-nbu-swx-nixl-pypi-local"
  # Source repo cloned in Build Wheel.
  NIXL_REPO_URL: "https://github.com/ai-dynamo/nixl.git"
  MAIL_FROM: "jenkins@nvidia.com"

steps:
  - name: Prepare
    containerSelector: "{name: 'manylinux'}"
    credentialsId:
      - 'svc-nixl-il-artifactory-token'
      - 'svc-nixl-github-read-only-token'
    parallel: false
    run: |
      # Set up podman and log in to Artifactory (base image pull)
      rm -f /etc/containers/storage.conf /usr/share/containers/storage.conf
      podman system reset -f || true
      ln -sfT $(type -p podman) /usr/bin/docker
      # github.com credential, used as the "ghconfig" build secret and by the
      # agent-side clones below.
      . .ci/scripts/common.sh
      write_github_gitconfig /tmp/ghconfig
      echo "$ARTIFACTORY_TOKEN" | docker login "https://${registry_host}" -u "$ARTIFACTORY_USER" --password-stdin

  - name: Checkout Source
    containerSelector: "{name: 'manylinux'}"
    parallel: false
    run: |
      # Clone the built source (contrib scripts + Dockerfile come from this
      # ref; CI config stays on main). Split from Build Wheel so a checkout
      # failure is triaged separately from a build failure.
      set -x
      # The Jenkins checkout is owned by a different uid; trust only it.
      git config --global --add safe.directory "${PWD}"
      # Full clone: build-container.sh derives a version label via
      # `git describe --tags`, which needs history + tags, not just the tree.
      rm -rf nixl-src
      git -c include.path=/tmp/ghconfig clone "${NIXL_REPO_URL}" nixl-src
      # fetch covers branch/tag/PR refs; the fallback covers raw shas. Fail
      # loud if neither resolves, so we never silently build the clone default.
      if git -C nixl-src fetch origin "${NIXL_VERSION}" 2>/dev/null; then
        git -C nixl-src checkout --detach FETCH_HEAD
      else
        git -C nixl-src checkout --detach "${NIXL_VERSION}" \
          || { echo "ERROR: cannot resolve NIXL_VERSION=${NIXL_VERSION}"; exit 1; }
      fi
      # Exact first 8 hex for the publish folder key (--short=8 is a minimum
      # and can extend on ambiguity).
      NIXL_SHA="$(git -C nixl-src rev-parse HEAD | cut -c1-8)"
      # Carried to Publish (folder key). UCX ref is not pinned here; it's
      # build-container.sh's own default and gets recorded in
      # build_options.env by the Build Wheel step instead.
      printf 'NIXL_SHA=%s\nNIXL_COMMIT=%s\n' "${NIXL_SHA}" "$(git -C nixl-src rev-parse HEAD)" > wheel_build_ids.env

  - name: Build Wheel
    containerSelector: "{name: 'manylinux'}"
    parallel: false
    run: |
      # Build the wheel image from the checked-out nixl-src. --tag pins the
      # image so Publish extracts dist/. No gitlab credentials: the plugin is
      # not cloned here, nixl-ci-compile-ucx-plugin compiled it.
      set -x
      # Infinia is always bundled in the nightly; the built source ref's
      # build-container.sh pins the image. The spcx plugin is not built here -
      # it was compiled against the same wheel_base and comes off the PVC.
      # The two CUDA majors have different torch coverage: 2.11 is not available
      # on the cu13 index, and 2.14 is not available on the cu12 one.
      # Never default the CUDA line: an unset axis falling through to cu13 made
      # both cells build cu13 under identical filenames, so each overwrote the
      # other and the folder silently held half a set.
      case "${cuda}" in
        12)
          BASE_IMAGE_FLAGS="--base-image ${CU12_BASE_IMAGE} --base-image-tag ${CU12_BASE_TAG} --cuda-version ${CU12_CUDA_VERSION}"
          TORCH_VERSIONS="2.11,2.12,2.13"
          ;;
        13)
          BASE_IMAGE_FLAGS=""
          TORCH_VERSIONS="2.12,2.13,2.14,2.15,2.16"
          ;;
        *)
          echo "ERROR: cuda is '${cuda:-<unset>}', expected 12 or 13"
          exit 1
          ;;
      esac
      export DOCKER_BUILD_EXTRA_ARGS="--secret id=ghconfig,src=/tmp/ghconfig"
      WHEEL_BASE_IMAGE="${registry_host}${registry_path}/${arch}/${WHEEL_BASE_IMAGE_NAME}-cu${cuda}:${WHEEL_BASE_TAG}"
      CELL_KEY="${manylinux}_${arch}_py${python_version}_cu${cuda}"

      # Ref + commit of the staged plugin module, written by
      # nixl-ci-compile-ucx-plugin next to the per-arch dirs. Another job
      # wrote it, so it is parsed key by key and validated, never sourced. A
      # malformed file is a plugin-job bug; an absent one is an older plugin
      # job, and the manifest records the plugin as unknown.
      SPCX_PROV="${SPCX_STAGING_ROOT}/${BUILD_NUMBER}/cu${cuda}/spcx-provenance.env"
      UCX_SPCX_PLUGIN_REF=""; UCX_SPCX_PLUGIN_COMMIT=""; SPCX_FLAGS=""
      if [ -f "${SPCX_PROV}" ]; then
        UCX_SPCX_PLUGIN_REF="$(grep -m1 '^UCX_SPCX_PLUGIN_REF=' "${SPCX_PROV}" | cut -d= -f2-)"
        UCX_SPCX_PLUGIN_COMMIT="$(grep -m1 '^UCX_SPCX_PLUGIN_COMMIT=' "${SPCX_PROV}" | cut -d= -f2-)"
        [[ "${UCX_SPCX_PLUGIN_REF}" =~ ^[A-Za-z0-9._/-]+$ ]] \
          || { echo "ERROR: malformed UCX_SPCX_PLUGIN_REF in ${SPCX_PROV}"; exit 1; }
        [[ "${UCX_SPCX_PLUGIN_COMMIT}" =~ ^[0-9a-f]{40}$ ]] \
          || { echo "ERROR: malformed UCX_SPCX_PLUGIN_COMMIT in ${SPCX_PROV}"; exit 1; }
        SPCX_FLAGS="--ucx-spcx-plugin-ref ${UCX_SPCX_PLUGIN_REF}"
        # Puts the "SPCX Plugin:" line back into the wheel README, which
        # build-container.sh only sets on its clone path. Refs that predate
        # the README block merely warn about an unconsumed build-arg.
        DOCKER_BUILD_EXTRA_ARGS+=" --build-arg UCX_SPCX_PLUGIN_VERSION=${UCX_SPCX_PLUGIN_COMMIT}"
      fi

      # Cell facts for the fragment Publish deposits, written before the
      # build so a failed cell leaves nothing behind.
      if [ -x nixl-src/contrib/wheel_build_info.py ]; then
        BUILD_INFO_SUPPORTED=true
      else
        BUILD_INFO_SUPPORTED=false
      fi
      {
        echo "CELL_KEY=${CELL_KEY}"
        echo "CUDA=${cuda}"
        echo "ARCH=${arch}"
        echo "PYTHON_VERSION=${python_version}"
        echo "MANYLINUX=${manylinux}"
        echo "TORCH_VERSIONS_REQUESTED=${TORCH_VERSIONS}"
        echo "WHEEL_BASE_IMAGE=${WHEEL_BASE_IMAGE}"
        echo "UCX_SPCX_PLUGIN_REF=${UCX_SPCX_PLUGIN_REF}"
        echo "UCX_SPCX_PLUGIN_COMMIT=${UCX_SPCX_PLUGIN_COMMIT}"
        echo "BUILD_INFO_SUPPORTED=${BUILD_INFO_SUPPORTED}"
      } > cell.env

      cd nixl-src
      ./contrib/build-container.sh \
        ${BASE_IMAGE_FLAGS} \
        --wheel-base "manylinux_${manylinux}" \
        --python-versions "${python_version}" \
        --arch ${arch} \
        --torch-versions "${TORCH_VERSIONS}" \
        --tag "${WHEEL_IMAGE_TAG}" \
        --dockerfile contrib/Dockerfile.manylinux \
        --wheel-base-image "${WHEEL_BASE_IMAGE}" \
        --ucx-spcx-plugin-install "${SPCX_STAGING_ROOT}/${BUILD_NUMBER}/cu${cuda}/${arch}" \
        ${SPCX_FLAGS} \
        --build-infinia \
        --build-options-file ../build_options.env

  - name: Publish
    containerSelector: "{name: 'manylinux'}"
    credentialsId: 'svc-nixl-new-artifactory-token'
    parallel: false
    run: |
      set -x
      # Extract the wheels from the built image, then upload.
      rm -rf dist && mkdir -p dist
      cid=$(docker create "${WHEEL_IMAGE_TAG}")
      docker cp "${cid}:/workspace/nixl/dist/." ./dist/
      # Sidecars from contrib/build-wheel.sh; refs that predate it have none.
      rm -rf build-info && mkdir -p build-info
      docker cp "${cid}:/workspace/nixl/build-info/." ./build-info/ 2>/dev/null \
        || echo "build-info/: not in the image (built ref predates it)"
      docker rm -f "${cid}" || true
      ls -l dist/

      # Nightly runs leave PUBLISH_DIR empty and publish to verification/;
      # manual release runs can pass release/<ver>. Allowlist it - the URL is
      # PUT with the service token, and a path like ../<other-repo> would
      # normalize into a different Artifactory repo.
      PUBLISH_DIR="${PUBLISH_DIR:-verification}"
      [[ "${PUBLISH_DIR}" =~ ^(verification|release/[A-Za-z0-9][A-Za-z0-9._-]*)$ ]] \
        || { echo "ERROR: invalid PUBLISH_DIR '${PUBLISH_DIR}'"; exit 1; }
      . ./wheel_build_ids.env
      . ./cell.env
      CELL_SPCX_REF="${UCX_SPCX_PLUGIN_REF}"

      # Outside the build_options.env guard below: the release folder no longer
      # carries the sha, so NIXL_SHA must be set even for a ref that predates
      # --build-options-file.
      PROPERTIES="NIXL_SHA=${NIXL_SHA}"
      PROPERTIES+=";NIXL_VERSION=${NIXL_VERSION}"
      PROPERTIES+=";JOB_NAME=${JOB_NAME}"
      PROPERTIES+=";BUILD_NUMBER=${BUILD_NUMBER}"

      # Provenance recorded by Build Wheel (contrib/build-container.sh
      # --build-options-file). Only set properties for values that exist,
      # so an older built ref without this flag just skips them.
      if [ -f build_options.env ]; then
        . ./build_options.env
        # The plugin job's provenance beats the built ref's own default.
        [ -z "${CELL_SPCX_REF}" ] || UCX_SPCX_PLUGIN_REF="${CELL_SPCX_REF}"
        [ -n "${UCX_REF:-}" ] && PROPERTIES+=";UCX_REF=${UCX_REF}"
        [ -n "${UCX_SHA:-}" ] && PROPERTIES+=";UCX_SHA=${UCX_SHA}"
        [ -n "${CUDA_VERSION:-}" ] && PROPERTIES+=";CUDA_VERSION=${CUDA_VERSION}"
        [ "${BUILD_UCX_SPCX_PLUGIN:-}" = "true" ] && [ -n "${UCX_SPCX_PLUGIN_REF:-}" ] \
          && PROPERTIES+=";UCX_SPCX_PLUGIN_REF=${UCX_SPCX_PLUGIN_REF}"
        [ "${BUILD_INFINIA:-}" = "true" ] && [ -n "${INFINIA_LIBS_IMAGE:-}" ] \
          && PROPERTIES+=";INFINIA_LIBS_IMAGE=${INFINIA_LIBS_IMAGE}"
        # A trailing `[ ... ] && ...` that does not fire would otherwise leave
        # the whole if-block with a non-zero status.
        true
      fi
      # From the plugin job's provenance file (cell.env), not build_options.env.
      if [ -n "${UCX_SPCX_PLUGIN_COMMIT:-}" ]; then
        PROPERTIES+=";UCX_SPCX_PLUGIN_COMMIT=${UCX_SPCX_PLUGIN_COMMIT}"
      fi

      # verification/ keeps its g<nixl-sha>.ucx<ucx-sha> schema (consumed by the
      # build-llm-container verification pipeline) and is shared between builds;
      # release/<ver> gets one folder per build.
      if [ "${PUBLISH_DIR}" = "verification" ]; then
        [ -n "${UCX_SHA:-}" ] || { echo "ERROR: verification publish needs UCX_SHA from build_options.env"; exit 1; }
        FOLDER="g${NIXL_SHA}.ucx${UCX_SHA}"
      else
        FOLDER="${BUILD_NUMBER}"
      fi
      DEST="${WHEEL_REPO_URL}/${PUBLISH_DIR}/${FOLDER}"
      PROPS_DEST="${WHEEL_REPO_API}/${PUBLISH_DIR}/${FOLDER}"

      # curl-PUT (no python on the runner for twine); Artifactory indexes it as a
      # pip repo. rc fails the step on any upload error; set +x hides the token.
      set +x
      rc=0
      for whl in dist/nixl*.whl; do
        curl -fsSL -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
          -T "${whl}" "${DEST}/$(basename "${whl}")" || rc=1
        curl -fsSL -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" -X PUT \
          "${PROPS_DEST}/$(basename "${whl}")?properties=${PROPERTIES}" || rc=1
      done
      # Deposit this cell's fragment for pipeline_stop's manifest. Best effort:
      # a missing fragment makes the manifest step mark the build UNSTABLE, it
      # must not fail a published wheel.
      if [ "$rc" -eq 0 ]; then
        WHEELS="$(cd dist && ls nixl*.whl | tr '\n' ' ')"
        printf 'PUBLISH_FOLDER=%s\nWHEELS="%s"\n' "${PUBLISH_DIR}/${FOLDER}" "${WHEELS% }" >> cell.env
        CELL_DIR="${MANIFEST_STAGING_ROOT}/${BUILD_NUMBER}/${CELL_KEY}"
        { mkdir -p "${CELL_DIR}" && cp cell.env wheel_build_ids.env "${CELL_DIR}/" \
          && { [ ! -f build_options.env ] || cp build_options.env "${CELL_DIR}/"; } \
          && { ! ls build-info/*.build-info.json >/dev/null 2>&1 || cp build-info/*.build-info.json "${CELL_DIR}/"; }; } \
          || echo "WARNING: manifest fragment not deposited under ${CELL_DIR}"
      fi
      exit $rc

taskName: '${name}_${manylinux}/${arch}/python_${python_version}/cu${cuda}'

# Display name distinguishes builds in the history list: #N-<source>.
pipeline_start:
  shell: action
  module: groovy
  containerSelector: "{name: 'manylinux'}"
  run: |
    def src = params.NIXL_VERSION ==~ /[0-9a-f]{40}/ ? params.NIXL_VERSION.take(8) : params.NIXL_VERSION
    currentBuild.displayName += "-${src}"

    // Compile the closed-source UCX spcx plugin against the wheel_base images
    // ci-demo just pushed, before any wheel is built. The job lives in the
    // plugin repo, so this passes an image name and tag and gets back only the
    // built module (on the PVC) and a result. Once per CUDA major: the module
    // links that image's UCX, so a cu12 wheel cannot take the cu13 build.
    for (cuda in ["12", "13"]) {
      def staging = "${env.SPCX_STAGING_ROOT}/${env.BUILD_NUMBER}/cu${cuda}"
      def res = build job: 'nixl-ci-compile-ucx-plugin',
        parameters: [
          string(name: 'WHEEL_BASE_NAME', value: "${env.WHEEL_BASE_IMAGE_NAME}-cu${cuda}"),
          string(name: 'WHEEL_BASE_TAG',  value: env.WHEEL_BASE_TAG),
          string(name: 'STAGING_DIR',     value: staging),
        ],
        propagate: false, wait: true
      echo "UCX spcx plugin compile (cu${cuda}): ${res.result} (${res.absoluteUrl})"
      if (res.result != 'SUCCESS') {
        error("UCX spcx plugin failed to compile against ${env.WHEEL_BASE_IMAGE_NAME}-cu${cuda}:${env.WHEEL_BASE_TAG} - see ${res.absoluteUrl}")
      }
    }

# Publishes build-manifest.json from the cells' fragments (UNSTABLE, never
# FAILURE, if that goes wrong), then settles the release folder - mark on
# SUCCESS, delete otherwise - and mails the unattended nightly when the result
# is not SUCCESS. A partial wheel set has to be rebuilt anyway, so publishing
# it would only mislead the poller. verification/ folders are shared between
# builds and are left alone either way.
pipeline_stop:
  shell: action
  module: groovy
  containerSelector: "{name: 'manylinux'}"
  run: |
    def jobStatus = currentBuild.result ?: 'SUCCESS'
    def publishDir = params.PUBLISH_DIR ?: ''
    // Publish's allowlist, not just a release/ prefix test: this builds a
    // credentialed DELETE, and curl normalizes dot segments, so
    // release/x/../../../<other-repo> would escape into a different repo.
    def isRelease = publishDir ==~ /release\/[A-Za-z0-9][A-Za-z0-9._-]*/
    if (!isRelease && publishDir.startsWith('release/')) {
        echo "PUBLISH_DIR '${publishDir}' is not a valid release path - skipping folder settlement"
    }
    def folderPath = "${publishDir}/${env.BUILD_NUMBER}"
    def folderUrl = "${env.WHEEL_REPO_UI}/${folderPath}"
    def removedNote = ''
    def manifestNote = ''

    // --- Build manifest: merge the per-cell fragments Publish deposited on the
    // PVC, cross-check them against each other and against Artifactory, and
    // publish build-manifest.json next to the wheels. Any problem here marks
    // the build UNSTABLE and is reported; it never changes what was published.
    def stagingRoot = env.MANIFEST_STAGING_ROOT
    def stagingDir = "${stagingRoot}/${env.BUILD_NUMBER}"
    // Publish's allowlist plus the folder component. A fragment is data
    // another step wrote, so the folder is re-checked before any URL is built.
    def folderRegex = /^(verification\/g[0-9a-f]{8}\.ucx[0-9a-f]{8}|release\/[A-Za-z0-9][A-Za-z0-9._-]*\/[0-9]+)$/

    // KEY=VALUE or KEY="VALUE" lines; blank and # lines are skipped.
    def parseEnv = { String text ->
        def map = [:]
        for (line in text.split('\n')) {
            def l = line.trim()
            if (!l || l.startsWith('#')) continue
            def i = l.indexOf('=')
            if (i < 1) continue
            def v = l.substring(i + 1)
            if (v.length() >= 2 && v.startsWith('"') && v.endsWith('"')) v = v.substring(1, v.length() - 1)
            map[l.substring(0, i)] = v
        }
        map
    }

    // Other jobs can write the PVC, so nothing read from it is ever
    // interpolated into a shell command: the staging dir is copied into the
    // workspace once, and only directory names that are cell keys are opened.
    def cellKeyRegex = /^[A-Za-z0-9._-]+$/
    def readCells = { String dir ->
        def cells = []
        sh "rm -rf manifest-fragments && mkdir -p manifest-fragments && if [ -d '${dir}' ]; then cp -a '${dir}/.' manifest-fragments/; fi"
        def names = sh(returnStdout: true, script: "ls -1 manifest-fragments").trim()
        if (!names) return cells
        for (name in names.split('\n')) {
            def c = [key: name, cell: [:], ids: [:], opts: [:], sidecar: null, sidecars: 0, valid: (name ==~ cellKeyRegex)]
            if (!c.valid) { cells << c; continue }
            def cdir = "manifest-fragments/${name}"
            if (fileExists("${cdir}/cell.env")) c.cell = parseEnv(readFile("${cdir}/cell.env"))
            if (fileExists("${cdir}/wheel_build_ids.env")) c.ids = parseEnv(readFile("${cdir}/wheel_build_ids.env"))
            if (fileExists("${cdir}/build_options.env")) c.opts = parseEnv(readFile("${cdir}/build_options.env"))
            def jsons = sh(returnStdout: true, script: "ls -1 ${cdir}/*.build-info.json 2>/dev/null || true").trim()
            if (jsons) {
                def files = jsons.split('\n')
                c.sidecars = files.size()
                c.sidecar = new groovy.json.JsonSlurperClassic().parseText(readFile(files[0]))
            }
            cells << c
        }
        cells
    }

    // Only HTTP 200 is conclusive, as in the poller.
    def curlJson = { String url ->
        def code = withEnv(["QUERY_URL=${url}"]) {
            sh(returnStdout: true, script: '''
                set +x
                curl -sS -o manifest-query.json -w '%{http_code}' --retry 3 --retry-delay 2 \
                  -u "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" "$QUERY_URL"
            ''').trim()
        }
        if (code != '200') throw new Exception("GET ${url} returned ${code}")
        new groovy.json.JsonSlurperClassic().parseText(readFile('manifest-query.json'))
    }

    // name -> [sha256, size] for every file in the folder, from Artifactory.
    // Names come from the listing; only plain ones are ever put into a URL.
    def fileNameRegex = /^[A-Za-z0-9._+-]+$/
    def artifactoryFiles = { String folder ->
        def listing = curlJson("${env.WHEEL_REPO_API}/${folder}?list&deep=0&listFolders=0")
        def files = [:]
        for (f in (listing.files ?: [])) {
            files[f.uri.toString().replaceFirst('^/', '')] = [sha256: f.sha2 ?: null, size: f.size]
        }
        for (name in files.keySet().toList()) {
            if (!files[name].sha256 && name ==~ fileNameRegex) {
                def one = curlJson("${env.WHEEL_REPO_API}/${folder}/${name}")
                files[name].sha256 = one.checksums?.sha256 ?: null
            }
        }
        files
    }

    // Validates the fragments (rules below) and builds the manifest document.
    // Every problem goes onto `errors`; the caller decides what to do with it.
    def assemble = { List allCells, Map files, List errors ->
        for (c in allCells.findAll { !it.valid }) errors << "staging entry '${c.key}' is not a cell key - ignored"
        def cells = allCells.findAll { it.valid }
        def expected = Integer.parseInt(env.EXPECTED_WHEEL_CELLS ?: '20')
        if (cells.size() != expected) errors << "expected ${expected} cell fragments, found ${cells.size()}"

        // A value every cell must agree on; returns it, or null when absent or in dispute.
        def agree = { String what, Closure get ->
            def seen = [:]
            for (c in cells) { def v = get(c); if (v != null && v != '') seen[v.toString()] = c.key }
            if (seen.size() > 1) errors << "${what} differs across cells: ${seen}"
            seen.size() == 1 ? seen.keySet().iterator().next() : null
        }
        def perCuda = { String what, Closure get ->
            def out = [:]
            for (cu in ['12', '13']) {
                def seen = [:]
                for (c in cells.findAll { it.cell.CUDA == cu }) { def v = get(c); if (v != null && v != '') seen[v.toString()] = c.key }
                if (seen.size() > 1) errors << "${what} differs across cu${cu} cells: ${seen}"
                out[cu] = seen.size() == 1 ? seen.keySet().iterator().next() : null
            }
            out
        }

        for (c in cells) {
            if (!c.cell.WHEELS || !c.cell.PUBLISH_FOLDER) errors << "cell ${c.key}: cell.env incomplete"
            if (c.cell.BUILD_INFO_SUPPORTED == 'true' && c.sidecars != 1) errors << "cell ${c.key}: expected 1 build-info sidecar, found ${c.sidecars}"
            if (c.sidecar && !(c.cell.WHEELS ?: '').tokenize(' ').contains(c.sidecar.wheel.name)) errors << "cell ${c.key}: sidecar describes ${c.sidecar.wheel.name}, not one of its wheels"
        }

        def folder = agree('PUBLISH_FOLDER') { it.cell.PUBLISH_FOLDER }
        if (!(folder ==~ folderRegex)) errors << "publish folder '${folder}' is not an allowed path"
        def nixlSha = agree('NIXL_SHA') { it.ids.NIXL_SHA }
        def nixlCommit = agree('NIXL_COMMIT') { it.ids.NIXL_COMMIT }
        def ucxRepo = agree('UCX_REPO') { it.opts.UCX_REPO }
        def ucxRef = agree('UCX_REF') { it.opts.UCX_REF }
        def ucxSha = agree('UCX_SHA') { it.opts.UCX_SHA }
        def spcxOn = agree('BUILD_UCX_SPCX_PLUGIN') { it.opts.BUILD_UCX_SPCX_PLUGIN }
        def spcxRef = agree('UCX_SPCX_PLUGIN_REF') { it.cell.UCX_SPCX_PLUGIN_REF }
        def spcxCommit = agree('UCX_SPCX_PLUGIN_COMMIT') { it.cell.UCX_SPCX_PLUGIN_COMMIT }
        def infOn = agree('BUILD_INFINIA') { it.opts.BUILD_INFINIA }
        def infImage = agree('INFINIA_LIBS_IMAGE') { it.opts.INFINIA_LIBS_IMAGE }
        def infDigest = agree('INFINIA_LIBS_DIGEST') { it.opts.INFINIA_LIBS_DIGEST }
        def ucxRelease = agree('UCX release (ucx_info)') { it.sidecar?.ucx?.release }
        def ucxBranch = agree('UCX branch (ucx_info)') { it.sidecar?.ucx?.branch }
        def ucxRevision = agree('UCX revision (ucx_info)') { it.sidecar?.ucx?.revision }
        def imageCommit = agree('NIXL commit (image)') { it.sidecar?.nixl?.commit }
        def baseImage = perCuda('BASE_IMAGE') { it.opts.BASE_IMAGE }
        def baseTag = perCuda('BASE_IMAGE_TAG') { it.opts.BASE_IMAGE_TAG }
        def cudaVersion = perCuda('CUDA_VERSION') { it.opts.CUDA_VERSION }
        def torchRequested = perCuda('TORCH_VERSIONS_REQUESTED') { it.cell.TORCH_VERSIONS_REQUESTED }

        // Declared (host-side build_options.env) vs measured (inside the image).
        // A tag or sha UCX_REF is checked out detached, so ucx_info reports 'HEAD'; the revision check below covers it.
        if (ucxBranch && ucxBranch != 'HEAD' && ucxRef && ucxBranch != ucxRef) errors << "UCX in the image is branch '${ucxBranch}' but the build declared '${ucxRef}'"
        if (ucxRevision && ucxSha && !(ucxSha.startsWith(ucxRevision) || ucxRevision.startsWith(ucxSha))) errors << "UCX revision in the image (${ucxRevision}) does not match the declared commit (${ucxSha})"
        if (imageCommit && nixlSha && !imageCommit.startsWith(nixlSha)) errors << "NIXL commit in the image (${imageCommit}) does not start with NIXL_SHA (${nixlSha})"

        // Wheel inventory: one distinct binary wheel per cell, one meta wheel shared by the cu12 cells.
        def binaryNames = []
        def metaCells = [:]
        for (c in cells) {
            for (name in (c.cell.WHEELS ?: '').tokenize(' ')) {
                if (name.startsWith('nixl-')) metaCells[name] = (metaCells[name] ?: []) + [c.key]
                else if (binaryNames.contains(name)) errors << "binary wheel ${name} was published by more than one cell"
                else binaryNames << name
            }
        }
        if (binaryNames.size() != expected) errors << "expected ${expected} binary wheels, found ${binaryNames.size()}"
        if (metaCells.size() != 1) errors << "expected exactly one meta wheel, found ${metaCells.keySet()}"
        def allNames = binaryNames + metaCells.keySet().toList()
        for (name in allNames) { if (!files.containsKey(name)) errors << "${name} is not in Artifactory folder ${folder}" }
        def unexpected = files.keySet().findAll { !allNames.contains(it) && it != 'build-manifest.json' }.toList().sort()

        def wheels = []
        def builtAll = []
        def skippedAll = []
        def toolSets = [:]
        for (c in cells) {
            def s = c.sidecar
            def name = s ? s.wheel.name : (c.cell.WHEELS ?: '').tokenize(' ').find { !it.startsWith('nixl-') }
            def art = files[name] ?: [:]
            def entry = [name: name, kind: 'binary', sha256: art.sha256, size: art.size,
                         local_sha256_matches: s ? (s.wheel.sha256 == art.sha256) : null,
                         cuda: c.cell.CUDA, python: c.cell.PYTHON_VERSION, arch: c.cell.ARCH,
                         platform: s?.wheel?.platform_tag, wheel_base_image: c.cell.WHEEL_BASE_IMAGE, cell: c.key,
                         build_info: s ? 'available' : (c.cell.BUILD_INFO_SUPPORTED == 'true' ? 'missing' : 'unavailable: built ref predates wheel_build_info.py'),
                         torch: null, toolchain: null, ucx: null]
            if (s) {
                if (art.sha256 && s.wheel.sha256 != art.sha256) errors << "${name}: sha256 in Artifactory differs from the file this build produced"
                entry.torch = [built: s.torch.built.collect { [version: it.version, channel: it.channel, resolved: it.resolved] }, skipped: s.torch.skipped]
                entry.toolchain = s.toolchain
                entry.ucx = [release: s.ucx.release, branch: s.ucx.branch, revision: s.ucx.revision]
                for (b in s.torch.built) builtAll << b.version.toString()
                for (k in s.torch.skipped) skippedAll << [version: k.version, python: c.cell.PYTHON_VERSION, cuda: c.cell.CUDA, reason: k.reason]
                for (tool in s.toolchain.keySet()) {
                    if (!toolSets.containsKey(tool)) toolSets[tool] = []
                    if (s.toolchain[tool] != null) toolSets[tool] << s.toolchain[tool].toString()
                }
            }
            wheels << entry
        }
        for (name in metaCells.keySet()) {
            def art = files[name] ?: [:]
            wheels << [name: name, kind: 'meta', sha256: art.sha256, size: art.size, uploaded_by_cells: metaCells[name].sort()]
        }
        def baseBlock = [:]
        for (cu in ['12', '13']) baseBlock[cu] = [image: baseImage[cu], tag: baseTag[cu], cuda_version: cudaVersion[cu], torch_requested: (torchRequested[cu] ?: '').tokenize(',')]
        def toolchain = [:]
        for (tool in toolSets.keySet().toList().sort()) toolchain[tool] = toolSets[tool].unique().sort()
        def version = binaryNames ? binaryNames[0].tokenize('-')[1] : null

        [folder: folder, doc: [
            schema_version: 1,
            generated_at: sh(returnStdout: true, script: 'date -u +%Y-%m-%dT%H:%M:%SZ').trim(),
            complete: errors.isEmpty(),
            errors: errors,
            nixl: [commit: nixlCommit, sha8: nixlSha, ref: params.NIXL_VERSION, version: version],
            ucx: [repo: ucxRepo, declared_ref: ucxRef, declared_commit: ucxSha, release: ucxRelease, branch: ucxBranch, revision: ucxRevision],
            spcx: [enabled: spcxOn == 'true', ref: spcxRef, commit: spcxCommit],
            infinia: [enabled: infOn == 'true', image: infImage, digest: infDigest],
            base_image: baseBlock,
            torch: [built: builtAll.unique().sort(), skipped: skippedAll],
            toolchain: toolchain,
            jenkins: [job: env.JOB_NAME, build: Integer.parseInt(env.BUILD_NUMBER), url: env.BUILD_URL,
                      ci_refspec: params.ci_refspec, nixl_version: params.NIXL_VERSION,
                      publish_dir: publishDir ?: 'verification', folder: folder],
            wheels: wheels,
            unexpected_files: unexpected,
        ]]
    }

    def publishManifest = { String folder, String json ->
        writeFile file: 'build-manifest.json', text: json
        archiveArtifacts artifacts: 'build-manifest.json'
        def code = sh(returnStdout: true, script: """
            set +x
            curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
              -u "\$ARTIFACTORY_USER:\$ARTIFACTORY_TOKEN" \
              -T build-manifest.json "${env.WHEEL_REPO_URL}/${folder}/build-manifest.json"
        """).trim()
        if (!(code in ['200', '201'])) throw new Exception("PUT build-manifest.json returned ${code}")
        echo "Published ${env.WHEEL_REPO_UI}/${folder}/build-manifest.json"
    }

    // Runs before the folder settlement so a marked release folder always has
    // its manifest; keyed off the status captured above, so a manifest problem
    // (UNSTABLE) never drops a complete wheel set.
    try {
        if (jobStatus == 'SUCCESS') {
            withCredentials([usernamePassword(
                    credentialsId: 'svc-nixl-new-artifactory-token',
                    usernameVariable: 'ARTIFACTORY_USER',
                    passwordVariable: 'ARTIFACTORY_TOKEN')]) {
                def errors = []
                def cells = readCells(stagingDir)
                def firstFolder = cells ? cells[0].cell.PUBLISH_FOLDER : null
                def files = (firstFolder && firstFolder ==~ folderRegex) ? artifactoryFiles(firstFolder) : [:]
                def m = assemble(cells, files, errors)
                def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(m.doc))
                if (!errors.isEmpty()) {
                    // Keep the evidence with the build; never upload an incomplete manifest.
                    writeFile file: 'build-manifest.json', text: json
                    archiveArtifacts artifacts: 'build-manifest.json'
                    throw new Exception(errors.join('; '))
                }
                publishManifest(m.folder, json)
            }
        } else {
            echo "Build manifest skipped: build result is ${jobStatus}"
        }
    } catch (e) {
        echo "WARNING: build manifest not published: ${e.message}"
        currentBuild.result = 'UNSTABLE'
        manifestNote = "<p>Build manifest NOT published: <b>${e.message}</b></p>"
    } finally {
        // Always clean this build's staging; prune what a crashed build left
        // behind, by age, like the plugin job does with its staging root.
        sh """
            rm -rf '${stagingDir}'
            if [ -d '${stagingRoot}' ]; then
              find '${stagingRoot}' -mindepth 1 -maxdepth 1 -type d -mmin +720 -exec rm -rf {} +
            fi
        """
    }

    if (isRelease) {
        withCredentials([usernamePassword(
                credentialsId: 'svc-nixl-new-artifactory-token',
                usernameVariable: 'ARTIFACTORY_USER',
                passwordVariable: 'ARTIFACTORY_TOKEN')]) {
            // Checks the status code, not curl's exit status: without -f curl
            // exits 0 on an HTTP error and a surviving folder reads as deleted.
            def dropFolder = {
                def code = sh(returnStdout: true, script: """
                    set +x
                    curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
                      -u "\$ARTIFACTORY_USER:\$ARTIFACTORY_TOKEN" \
                      -X DELETE "${env.WHEEL_REPO_URL}/${folderPath}"
                """).trim()
                if (code in ['200', '204']) {
                    echo "Removed ${folderPath}"
                    return true
                }
                if (code == '404') {
                    echo "Nothing to remove at ${folderPath}"
                    return true
                }
                echo "WARNING: DELETE ${folderPath} returned ${code} - it may still be published"
                return false
            }

            if (jobStatus == 'SUCCESS') {
                // The poller always passes a full sha; a manual run naming a
                // branch/tag needs one ls-remote.
                def sha = params.NIXL_VERSION ==~ /[0-9a-f]{40}/
                    ? params.NIXL_VERSION.take(8)
                    : sh(returnStdout: true, script: """
                          git ls-remote "${env.NIXL_REPO_URL}" "${params.NIXL_VERSION}" \
                            | head -1 | cut -c1-8
                      """).trim()
                if (!sha) {
                    error("cannot resolve NIXL_SHA for the ${folderPath} completion marker")
                }
                try {
                    // recursive=0: the properties API defaults to recursive and
                    // would stamp this over each wheel's own NIXL_SHA.
                    sh """
                        set +x
                        curl -fsSL --retry 3 --retry-delay 2 \
                          -u "\$ARTIFACTORY_USER:\$ARTIFACTORY_TOKEN" -X PUT \
                          "${env.WHEEL_REPO_API}/${folderPath}?properties=NIXL_SHA=${sha}&recursive=0"
                    """
                    currentBuild.description = "<a href='${folderUrl}'>${folderPath}</a>"
                    echo "Published wheel set: ${folderUrl} (NIXL_SHA=${sha})"
                } catch (err) {
                    // Unmarked, nothing purges release/, and the commit gets
                    // rebuilt anyway - so drop it rather than orphan it.
                    echo "Could not mark ${folderPath} - removing it"
                    dropFolder()
                    throw err
                }
            } else {
                removedNote = dropFolder()
                    ? "<p>Partial wheel set removed: <b>${folderPath}</b></p>"
                    : "<p>Partial wheel set at <b>${folderPath}</b> could NOT be removed - delete it manually</p>"
            }
        }
    }

    def finalStatus = currentBuild.result ?: 'SUCCESS'
    if (finalStatus != 'SUCCESS' && params.MAIL_TO) {
        def userName = currentBuild.rawBuild.getCause(hudson.model.Cause.UserIdCause)?.userName ?: 'schedule'
        mail(
            from: env.MAIL_FROM,
            to: params.MAIL_TO,
            subject: "Job '${env.JOB_NAME} [${env.BUILD_NUMBER}]' - ${finalStatus}",
            mimeType: 'text/html',
            body: """
                <p>Started by: <b>${userName}</b></p>
                <p>Status: <span style="color: red;"><b>${finalStatus}</b></span></p>
                <p>Job: <a href='${env.JOB_URL}'>${env.JOB_NAME}</a></p>
                <p>Build: <a href='${env.BUILD_URL}'>#${env.BUILD_NUMBER}</a></p>
                <p>Console Output: <a href='${env.BUILD_URL}console'>Full Log</a></p>
                <p>NIXL Version: <b>${params.NIXL_VERSION}</b></p>
                ${removedNote}
                ${manifestNote}
            """
        )
    }
